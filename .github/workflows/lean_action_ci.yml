name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep texlive-latex-base texlive-latex-recommended protobuf-compiler python3-pil ffmpeg texlive-pictures texlive-latex-extra
          rg --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/chatui_requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install React UI dependencies
        run: npm ci --prefix ui
      - name: Reject tracked runtime account data
        run: |
          tracked_data="$(git ls-files -- data/)"
          if [[ -n "$tracked_data" ]]; then
            printf '%s\n' "$tracked_data" >&2
            echo 'Runtime account data must not be committed.' >&2
            exit 1
          fi
      # Ubuntu 24.04 lets an unprivileged process create a user namespace but gives it no
      # capabilities inside, so bwrap cannot bring up loopback ("Failed RTM_NEWADDR"). This
      # throwaway runner allows them; the sandbox itself still drops every capability.
      - name: Allow unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify required sandbox support
        run: python3 scripts/chatui_sandbox_check.py
      - uses: leanprover/lean-action@v1
      - name: Install the project-local Go toolchain (checksum verified)
        run: make go-toolchain
      - run: cp book/main-dark.pdf book/main.pdf
      - name: Run required ChatUI checks
        run: make chatui-check
      - name: Run validation, logic and MCP checks
        run: make validate
      - name: Run self-hosting checks
        run: make selfhost-check
      - name: Check generated protocol outputs are current
        run: |
          lake env lean --run NeedhamSchroeder.lean
          git diff --exit-code -- book/generated SELF_HOSTING_REVIEW.md
