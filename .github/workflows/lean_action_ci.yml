name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/chatui_requirements.txt
      - name: Reject tracked runtime account data
        run: |
          tracked_data="$(git ls-files -- data/)"
          if [[ -n "$tracked_data" ]]; then
            printf '%s\n' "$tracked_data" >&2
            echo 'Runtime account data must not be committed.' >&2
            exit 1
          fi
      - uses: leanprover/lean-action@v1
      - run: cp book/main-dark.pdf book/main.pdf
      - run: make chatui-check
      - run: lake build LeanFM.ChatUI.Implementation
      - run: lake env lean LeanFM/ChatUI/Validate.lean
