name = "LeanFM"
version = "0.1.0"
defaultTargets = ["leanfm"]

[[lean_lib]]
name = "LeanFM"

[[lean_exe]]
name = "leanfm"
root = "Main"

[[lean_exe]]
name = "leanfm-server"
root = "Server"

[[lean_exe]]
name = "leanfm-diagrams"
root = "Diagrams"

[[lean_exe]]
name = "leanfm-validate"
root = "Validate"

[[lean_exe]]
name = "leanfm-mcp"
root = "McpServer"

# test modules with a main, compiled so their runs are native, not interpreted (selfhost.build.changed-tests)
[[lean_exe]]
name = "leanfm-mcp-tests"
root = "LeanFM.MCPTests"

[[lean_exe]]
name = "leanfm-logic-tests"
root = "LeanFM.LogicTests"
