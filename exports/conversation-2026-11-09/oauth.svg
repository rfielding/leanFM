<svg xmlns="http://www.w3.org/2000/svg" width="1233" height="652" viewBox="0 0 1233 652" font-family="ui-sans-serif, system-ui, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="10" y="14" text-anchor="start" fill="#4b5563" font-size="11" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">OAuthPKCE</text><rect class="role" x="50" y="20" width="80" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="90" y="39" text-anchor="middle" fill="#111827" font-size="12" class="boxed">Browser</text><rect class="role" x="50" y="612" width="80" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="90" y="631" text-anchor="middle" fill="#111827" font-size="12" class="boxed">Browser</text><line class="lifeline" x1="90" y1="48" x2="90" y2="612" stroke="#9ca3af" stroke-dasharray="4 4"/><rect class="role" x="417" y="20" width="48" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="441" y="39" text-anchor="middle" fill="#111827" font-size="12" class="boxed">App</text><rect class="role" x="417" y="612" width="48" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="441" y="631" text-anchor="middle" fill="#111827" font-size="12" class="boxed">App</text><line class="lifeline" x1="441" y1="48" x2="441" y2="612" stroke="#9ca3af" stroke-dasharray="4 4"/><rect class="role" x="740" y="20" width="104" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="792" y="39" text-anchor="middle" fill="#111827" font-size="12" class="boxed">AuthServer</text><rect class="role" x="740" y="612" width="104" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="792" y="631" text-anchor="middle" fill="#111827" font-size="12" class="boxed">AuthServer</text><line class="lifeline" x1="792" y1="48" x2="792" y2="612" stroke="#9ca3af" stroke-dasharray="4 4"/><rect class="role" x="1119" y="20" width="48" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="1143" y="39" text-anchor="middle" fill="#111827" font-size="12" class="boxed">API</text><rect class="role" x="1119" y="612" width="48" height="28" rx="4" fill="#f3f4f6" stroke="#111827"/><text x="1143" y="631" text-anchor="middle" fill="#111827" font-size="12" class="boxed">API</text><line class="lifeline" x1="1143" y1="48" x2="1143" y2="612" stroke="#9ca3af" stroke-dasharray="4 4"/><rect class="activation" x="436" y="100" width="10" height="68" fill="#f3f4f6" stroke="#1d4ed8"/><rect class="activation" x="787" y="198" width="10" height="30" fill="#f3f4f6" stroke="#1d4ed8"/><rect class="activation" x="787" y="258" width="10" height="30" fill="#f3f4f6" stroke="#1d4ed8"/><rect class="activation" x="436" y="318" width="10" height="264" fill="#f3f4f6" stroke="#1d4ed8"/><rect class="activation" x="787" y="386" width="10" height="68" fill="#f3f4f6" stroke="#1d4ed8"/><rect class="activation" x="1138" y="484" width="10" height="68" fill="#f3f4f6" stroke="#1d4ed8"/><line class="msg" x1="90" y1="100" x2="441" y2="100" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#head)"/><text x="265" y="94" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a: Start connection</text><rect class="act" x="300" y="112" width="282" height="24" rx="10" fill="#f3f4f6" stroke="#1d4ed8"/><text x="441" y="128" text-anchor="middle" fill="#111827" font-size="12" class="boxed">Create verifier, S256 challenge, state</text><line class="msg reply" x1="441" y1="168" x2="90" y2="168" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="265" y="162" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">b: Open authorization URL</text><line class="msg" x1="90" y1="198" x2="792" y2="198" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#head)"/><text x="441" y="192" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">c: Authorize: client, scope, challenge, state</text><line class="msg reply" x1="792" y1="228" x2="90" y2="228" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="441" y="222" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">d: Sign-in and consent screen</text><line class="msg" x1="90" y1="258" x2="792" y2="258" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#head)"/><text x="441" y="252" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">e: User signs in and grants access</text><line class="msg reply" x1="792" y1="288" x2="90" y2="288" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="441" y="282" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">f: Redirect: code and state</text><line class="msg" x1="90" y1="318" x2="441" y2="318" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#head)"/><text x="265" y="312" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">g: Callback: code and state</text><rect class="act" x="314" y="330" width="254" height="24" rx="10" fill="#f3f4f6" stroke="#1d4ed8"/><text x="441" y="346" text-anchor="middle" fill="#111827" font-size="12" class="boxed">Validate state and expected issuer</text><line class="msg" x1="441" y1="386" x2="792" y2="386" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#head)"/><text x="616" y="380" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">h: Exchange code + verifier + redirect URI</text><rect class="act" x="641" y="398" width="303" height="24" rx="10" fill="#f3f4f6" stroke="#1d4ed8"/><text x="792" y="414" text-anchor="middle" fill="#111827" font-size="12" class="boxed">Validate code, client, redirect URI, PKCE</text><line class="msg reply" x1="792" y1="454" x2="441" y2="454" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="616" y="448" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">i: Access token (optional refresh token)</text><line class="msg" x1="441" y1="484" x2="1143" y2="484" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#head)"/><text x="792" y="478" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">j: API request + access token</text><rect class="act" x="999" y="496" width="289" height="24" rx="10" fill="#f3f4f6" stroke="#1d4ed8"/><text x="1143" y="512" text-anchor="middle" fill="#111827" font-size="12" class="boxed">Validate token, audience, expiry, scope</text><line class="msg reply" x1="1143" y1="552" x2="441" y2="552" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="792" y="546" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">k: Authorized data</text><line class="msg reply" x1="441" y1="582" x2="90" y2="582" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="265" y="576" text-anchor="middle" fill="#111827" font-size="12" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Show result</text></svg>
