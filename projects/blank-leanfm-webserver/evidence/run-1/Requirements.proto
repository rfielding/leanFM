syntax = "proto3";

package leanfm.requirements.v1;

// Candidate wire contract reconstructed only from book/main.pdf, chapter 12.
// EventEnvelope metadata tag choices are candidate choices because the book
// specifies their meaning, but not their exact tag numbers (AMB-001).
message EventEnvelope {
  string event_id = 1;
  repeated string prior_ids = 2;
  string session_id = 3;
  string task_id = 4;
  uint64 logical_time = 5;
  string src = 6;
  string dst = 7;
  oneof payload {
    LoginSubmitted login_submitted = 20;
    LoginAccepted login_accepted = 21;
    LoginRejected login_rejected = 22;
    AccountCreateSubmitted account_create_submitted = 23;
    ProviderKeyCheckRequested provider_key_check_requested = 24;
    ProviderKeyVerified provider_key_verified = 25;
    ProviderKeyRejected provider_key_rejected = 26;
    AccountCreated account_created = 27;
    AccountCreateRejected account_create_rejected = 28;
    TaskModelRequested task_model_requested = 29;
    TaskModelReturned task_model_returned = 30;
    MessageSequenceRequested message_sequence_requested = 31;
    MessageSequenceReturned message_sequence_returned = 32;
    ProtobufObjectRequested protobuf_object_requested = 33;
    ProtobufObjectReturned protobuf_object_returned = 34;
    WebResearchRequested web_research_requested = 35;
    WebResearchDispatched web_research_dispatched = 36;
    WebSearchPerformed web_search_performed = 37;
    WebPageOpened web_page_opened = 38;
    WebResearchReturned web_research_returned = 39;
    WebResearchFailed web_research_failed = 40;
    MarkerboardAssistRequested markerboard_assist_requested = 41;
    MarkerboardSyntaxHelpReturned markerboard_syntax_help_returned = 42;
    MarkerboardAssistDispatched markerboard_assist_dispatched = 43;
    MarkerboardAssistReturned markerboard_assist_returned = 44;
    MarkerboardPatchProposed markerboard_patch_proposed = 45;
    MarkerboardPatchAccepted markerboard_patch_accepted = 46;
    MarkerboardPatchRejected markerboard_patch_rejected = 47;
    MarkerboardDraftUpdated markerboard_draft_updated = 48;
    ProjectListRequested project_list_requested = 49;
    ProjectListReturned project_list_returned = 50;
    ProjectCreateRequested project_create_requested = 51;
    ProjectCreated project_created = 52;
    ProjectOpenRequested project_open_requested = 53;
    ProjectOpened project_opened = 54;
    ProjectDeleteRequested project_delete_requested = 55;
    ProjectDeleted project_deleted = 56;
    ProviderCredentialSubmitted provider_credential_submitted = 57;
    ProviderCredentialAccepted provider_credential_accepted = 58;
    ProviderCredentialRejected provider_credential_rejected = 59;
    ChatPromptSubmitted chat_prompt_submitted = 60;
    ModelRequestIssued model_request_issued = 61;
    ModelResponseReturned model_response_returned = 62;
    ChatResponseRendered chat_response_rendered = 63;
    ChatTurnFailed chat_turn_failed = 64;
    MermaidDraftSaved mermaid_draft_saved = 65;
    MermaidPreviewRendered mermaid_preview_rendered = 66;
    MediaUploaded media_uploaded = 67;
    MediaRendered media_rendered = 68;
    ArtifactPromoted artifact_promoted = 69;
    CandidateRequirementUpdated candidate_requirement_updated = 70;
    ArtifactListRequested artifact_list_requested = 71;
    ArtifactListReturned artifact_list_returned = 72;
    ArtifactOpenRequested artifact_open_requested = 73;
    ArtifactOpened artifact_opened = 74;
  }
}

message LoginSubmitted { string username = 1; bytes credential = 2; }
message LoginAccepted { string user_id = 1; string session_id = 2; }
message LoginRejected { string reason = 1; }
message AccountCreateSubmitted { string username = 1; bytes login_credential = 2; string provider = 3; bytes api_key = 4; }
message ProviderKeyCheckRequested { string provider = 1; string verification_id = 2; }
message ProviderKeyVerified { string verification_id = 1; string provider_account = 2; }
message ProviderKeyRejected { string verification_id = 1; string reason = 2; }
message AccountCreated { string user_id = 1; string credential_ref = 2; }
message AccountCreateRejected { string reason = 1; }
message TaskModelRequested { string project_id = 1; string task_id = 2; string requirements_revision = 3; }
message TaskModelReturned { string task_id = 1; string interaction_artifact_id = 2; string state_machine_artifact_id = 3; string message_sequence_artifact_id = 4; repeated string constraint_ids = 5; }
message MessageSequenceRequested { string project_id = 1; string task_id = 2; string session_id = 3; }
message MessageSequenceReturned { string task_id = 1; string session_id = 2; repeated string event_ids = 3; }
message ProtobufObjectRequested { string project_id = 1; string event_id = 2; }
message ProtobufObjectReturned { string event_id = 1; string protobuf_type = 2; bytes encoded_object = 3; string redacted_json = 4; }
message WebResearchRequested { string project_id = 1; string conversation_id = 2; string request_id = 3; string question = 4; repeated string supplied_urls = 5; }
message WebResearchDispatched { string request_id = 1; string model = 2; string research_mode = 3; }
message WebSearchPerformed { string request_id = 1; repeated string queries = 2; }
message WebPageOpened { string request_id = 1; string url = 2; string title = 3; }
message WebResearchReturned { string request_id = 1; bytes parts = 2; repeated string source_urls = 3; }
message WebResearchFailed { string request_id = 1; string reason = 2; }
message MarkerboardAssistRequested { string project_id = 1; string artifact_id = 2; uint64 base_revision = 3; string diagram_kind = 4; string source = 5; string instruction = 6; string mode = 7; string credential_ref = 8; }
message MarkerboardSyntaxHelpReturned { string artifact_id = 1; uint64 base_revision = 2; string help_markdown = 3; }
message MarkerboardAssistDispatched { string request_id = 1; string artifact_id = 2; uint64 base_revision = 3; string diagram_kind = 4; string source = 5; string instruction = 6; }
message MarkerboardAssistReturned { string request_id = 1; string proposed_source = 2; string explanation = 3; uint64 input_tokens = 4; uint64 output_tokens = 5; }
message MarkerboardPatchProposed { string artifact_id = 1; uint64 base_revision = 2; string proposed_source = 3; string explanation = 4; }
message MarkerboardPatchAccepted { string artifact_id = 1; uint64 base_revision = 2; string proposed_source = 3; }
message MarkerboardPatchRejected { string artifact_id = 1; uint64 base_revision = 2; }
message MarkerboardDraftUpdated { string artifact_id = 1; uint64 revision = 2; string source = 3; }
message ProjectListRequested { string user_id = 1; }
message ProjectListReturned { repeated string project_ids = 1; }
message ProjectCreateRequested { string display_name = 1; }
message ProjectCreated { string project_id = 1; string display_name = 2; }
message ProjectOpenRequested { string project_id = 1; }
message ProjectOpened { string project_id = 1; string current_requirements_revision = 2; }
message ProjectDeleteRequested { string project_id = 1; string confirmation = 2; }
message ProjectDeleted { string project_id = 1; }
message ProviderCredentialSubmitted { string provider = 1; bytes api_key = 2; string retention = 3; }
message ProviderCredentialAccepted { string credential_ref = 1; string billing_source = 2; }
message ProviderCredentialRejected { string reason = 1; }
message ChatPromptSubmitted { string project_id = 1; string conversation_id = 2; string message_id = 3; bytes parts = 4; repeated string attachment_ids = 5; string credential_ref = 6; }
message ModelRequestIssued { string project_id = 1; string conversation_id = 2; string request_id = 3; string model = 4; string research_mode = 5; }
message ModelResponseReturned { string request_id = 1; bytes parts = 2; uint64 input_tokens = 3; uint64 cached_input_tokens = 4; uint64 output_tokens = 5; uint64 context_window_tokens = 6; }
message ChatResponseRendered { string conversation_id = 1; string message_id = 2; bytes parts = 3; repeated string artifact_ids = 4; uint64 input_tokens = 5; uint64 cached_input_tokens = 6; uint64 output_tokens = 7; uint64 context_window_tokens = 8; string usage_warning = 9; }
message ChatTurnFailed { string request_id = 1; string reason = 2; }
message MermaidDraftSaved { string project_id = 1; string artifact_id = 2; uint64 revision = 3; string diagram_kind = 4; string source = 5; }
message MermaidPreviewRendered { string artifact_id = 1; uint64 revision = 2; bytes svg = 3; }
message MediaUploaded { string project_id = 1; string artifact_id = 2; string media_type = 3; bytes content = 4; }
message MediaRendered { string artifact_id = 1; string media_type = 2; string content_url = 3; }
message ArtifactPromoted { string artifact_id = 1; uint64 revision = 2; string target_status = 3; }
message CandidateRequirementUpdated { string requirements_revision = 1; repeated string source_artifact_ids = 2; }
message ArtifactListRequested { string project_id = 1; string kind_filter = 2; string scenario_filter = 3; string status_filter = 4; }
message ArtifactListReturned { bytes artifacts = 1; }
message ArtifactOpenRequested { string artifact_id = 1; uint64 revision = 2; }
message ArtifactOpened { string artifact_id = 1; uint64 revision = 2; string status = 3; string media_type = 4; bytes content = 5; string provenance = 6; }
