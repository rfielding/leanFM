<!doctype html>
<html><head><meta charset="utf-8"><title>Paxos KV</title><meta name="color-scheme" content="dark only">
<style>html,body{background:#111;color:#f0ede4}body{font:18px system-ui;max-width:52rem;margin:2rem auto;padding:0 1rem}form{display:grid;grid-template-columns:1fr 2fr auto;gap:.5rem}input,button{font:inherit;padding:.5rem;background:#1f2937;color:#f0ede4;border:1px solid #60a5fa;border-radius:4px}button{cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:1.5rem}th,td{border:1px solid #444;text-align:left;padding:.45rem}th{background:#1f2937}.error{color:#fca5a5}small{color:#cbd5e1}</style></head>
<body><h1>Paxos key/value database</h1>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/put"><input name="key" required maxlength="128" placeholder="key" aria-label="key"><input name="value" maxlength="4096" placeholder="value" aria-label="value"><button>Store</button></form>
<h2>Committed key/value pairs</h2><table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>{{range .Rows}}<tr><td>{{.Key}}</td><td>{{.Value}}</td></tr>{{end}}</tbody></table>
<small>committed through slot {{.Slot}}</small></body></html>
