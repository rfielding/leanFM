syntax = "proto3";

package leanfm.paxoskv;

// requirement:paxos_kv.visible_behavior
// All replica traffic uses this protobuf envelope inside a uint32 length frame.
message Envelope {
  string type = 1;
  string request_id = 2;
  uint64 ballot_counter = 3;
  string ballot_node = 4;
  uint64 slot = 5;
  string key = 6;
  string value = 7;
  bool success = 8;
  string error = 9;
  repeated Entry entries = 10;
  uint64 accepted_ballot_counter = 11;
  string accepted_ballot_node = 12;
  bool committed = 13;
  string session = 14;
  repeated SlotState slots = 15;
}

message Entry {
  string key = 1;
  string value = 2;
}

message SlotState {
  uint64 slot = 1;
  uint64 promised_counter = 2;
  string promised_node = 3;
  uint64 accepted_counter = 4;
  string accepted_node = 5;
  string key = 6;
  string value = 7;
  bool committed = 8;
  string request_id = 9;
}
