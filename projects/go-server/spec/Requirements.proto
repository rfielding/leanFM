syntax = "proto3";
package goserver.playable.v1;
// Requirements-owned values for playable-v1. HTTP conversions live in
// Requirements.lean. Actual HTTP values are round-tripped with protoc bindings;
// no hand-written file is labelled protoc-generated.
message Action { string kind = 1; int32 point = 2; }
message Position {
  uint32 size = 1; uint32 players = 2; repeated int32 board = 3;
  uint32 turn = 4; repeated int32 losses = 5; repeated int32 ledger = 6;
  repeated bool active = 7; uint32 passes = 8; uint32 ply = 9;
  uint32 max_turns = 10; bool finished = 11; int32 last = 12;
}
message Room {
  string id = 1; repeated string names = 2; Position position = 3;
  repeated Position history = 4; repeated Action actions = 5;
  uint32 revision = 6; int64 deadline_ms = 7;
}
message TraceEvent {
  string id = 1; string cause_id = 2; repeated string prior_ids = 3;
  string session = 4; string task = 5; string src = 6; string dst = 7;
  string message = 8; int64 time_ms = 9;
}
message Response {
  Room game = 1; string token = 2; optional int32 seat = 3;
  string error = 4; repeated TraceEvent events = 5;
}
message CreateGame { uint32 size = 1; uint32 players = 2; uint32 max_turns = 3; string name = 4; }
message JoinGame { string name = 1; }
message MakeMove { uint32 revision = 1; Action action = 2; }
message Pass { uint32 revision = 1; Action action = 2; }
message Resign { uint32 revision = 1; Action action = 2; }
message InspectGame { string id = 1; }
message InspectHistory { string id = 1; }
message ExportGIF { uint32 size = 1; uint32 players = 2; uint32 max_turns = 3; repeated Action actions = 4; }
message GameCreated { Room game = 1; string token = 2; optional int32 seat = 3; repeated TraceEvent events = 5; }
message Joined { Room game = 1; string token = 2; optional int32 seat = 3; repeated TraceEvent events = 5; }
message MoveEvent { Room game = 1; repeated TraceEvent events = 5; }
message GameState { Room game = 1; repeated TraceEvent events = 5; }
message HistoryReturned { Room game = 1; repeated TraceEvent events = 5; }
message GIFCreated { string project_path = 1; uint32 final_ply = 2; }
message ErrorEvent { string error = 4; repeated TraceEvent events = 5; }
