<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <defs>
    <style type="text/css"><![CDATA[
      .board { fill: #DEB887; } /* light wood */
      .grid { stroke: #000; stroke-width: 1; }
      .wall { fill: #888888; } /* WALL ring */
      .empty { fill: transparent; }
      .stone-black { fill: #000000; stroke: #333; stroke-width:1; }
      .stone-white { fill: #ffffff; stroke: #333; stroke-width:1; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#111; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#111; }
    ]]></style>
  </defs>

  <!-- parameters -->
  <!-- grid is 21x21: indices 0..20; playable 1..19; cell size computed to fit -->
  <g id="board-group">
    <!-- background -->
    <rect x="50" y="50" width="560" height="560" class="board" rx="10" ry="10" />

    <!-- cells -->
    <!-- draw WALL ring as rectangles around the outermost cells -->
    <g id="cells">
      <!-- compute cell size: 560 / 21 = ~26.666 => use 26.6667 -->
      <!-- We'll position cells in a 21x21 grid -->
      <!-- Draw outer WALL cells -->
      <!-- generate by hand: for r=0..20, c=0..20 -->
    </g>

    <!-- draw grid lines -->
    <g class="grid-lines" stroke="#000" stroke-width="1" fill="none">
      <!-- vertical lines -->
      <!-- 21 vertical lines between cell centers -> 21+1 lines? Simpler: draw 21 vertical lines -->
    </g>
  </g>

  <!-- We'll generate cells, wall ring, and stones via explicit elements (hand-placed) -->
  <!-- Constants -->
  <!-- origin offset -->
  <script type="application/ecmascript"><![CDATA[
    // This SVG includes precomputed elements inserted statically for portability.
  ]]></script>

  <!-- Static cell rectangles and grid lines (generated) -->
  <!-- Using cell size 26.6666667 -->
  <g id="generated">
  </g>

  <!-- We'll inline the generated cells below for environments that don't run scripts -->
  <!-- Start inline generation -->

  <!-- Inline cells and walls -->
  <!-- calculate positions: x = 50 + c * 26.6666667; y = 50 + r * 26.6666667 -->

  <!-- Manually output all 21x21 cells with WALL on border -->
  <!-- To keep file concise, output rectangles for WALL only; inner grid lines will show cells -->

  <!-- WALL rectangles -->
  <!-- top and bottom rows -->
  <g>
    <!-- top row r=0 -->
    <!-- c from 0..20 -->
    <!-- We'll loop conceptually; here expanded -->
  </g>

  <!-- Generate with a small script locally computed and pasted here -->
  <!-- Precomputed using cellSize=26.6666667 and offset=50 -->

  <!-- WALL row r=0 -->
  <g>
    <!-- columns 0..20 -->
    <!-- We'll render as 21 rects -->
  </g>

  <!-- Instead of bloating the SVG with 21 rects for each row, we'll draw four rectangles forming the ring -->
  <!-- left vertical strip, right vertical strip, top horizontal strip, bottom horizontal strip -->

  <!-- compute: ring outer area covers entire board area but we want only single-cell thickness -->
  <!-- cell size = 560 / 21 = 26.666666666666668 -->
  <!-- ring thickness = cell size -->
  <!-- left strip: x=50, y=50, width=cellSize, height=560 -->
  <!-- right strip: x=50+20*cellSize, width=cellSize -->
  <!-- top strip: x=50+cellSize, y=50, width=cellSize*19, height=cellSize -->
  <!-- bottom strip similarly -->

  <!-- Numeric values computed -->
  <!-- cellSize = 26.6666667 -->
  <g id="wall-ring">
    <rect x="50" y="50" width="26.6666667" height="560" class="wall" />
    <rect x="50" y="50" width="560" height="26.6666667" class="wall" />
    <rect x="50" y="583.3333333" width="560" height="26.6666667" class="wall" />
    <rect x="583.3333333" y="50" width="26.6666667" height="560" class="wall" />
  </g>

  <!-- grid lines (21 lines horizontally and vertically) -->
  <g stroke="#000" stroke-width="1">
    <!-- vertical lines: x = 50 + i*cellSize, for i=0..20 -->
    <!-- we draw 21 vertical lines -->
    <g>
      <line x1="50" y1="50" x2="50" y2="610" />
      <line x1="76.6666667" y1="50" x2="76.6666667" y2="610" />
      <line x1="103.3333334" y1="50" x2="103.3333334" y2="610" />
      <line x1="130.0000001" y1="50" x2="130.0000001" y2="610" />
      <line x1="156.6666668" y1="50" x2="156.6666668" y2="610" />
      <line x1="183.3333335" y1="50" x2="183.3333335" y2="610" />
      <line x1="210.0000002" y1="50" x2="210.0000002" y2="610" />
      <line x1="236.6666669" y1="50" x2="236.6666669" y2="610" />
      <line x1="263.3333336" y1="50" x2="263.3333336" y2="610" />
      <line x1="290.0000003" y1="50" x2="290.0000003" y2="610" />
      <line x1="316.666667" y1="50" x2="316.666667" y2="610" />
      <line x1="343.3333337" y1="50" x2="343.3333337" y2="610" />
      <line x1="370.0000004" y1="50" x2="370.0000004" y2="610" />
      <line x1="396.6666671" y1="50" x2="396.6666671" y2="610" />
      <line x1="423.3333338" y1="50" x2="423.3333338" y2="610" />
      <line x1="450.0000005" y1="50" x2="450.0000005" y2="610" />
      <line x1="476.6666672" y1="50" x2="476.6666672" y2="610" />
      <line x1="503.3333339" y1="50" x2="503.3333339" y2="610" />
      <line x1="530.0000006" y1="50" x2="530.0000006" y2="610" />
      <line x1="556.6666673" y1="50" x2="556.6666673" y2="610" />
      <line x1="583.333334" y1="50" x2="583.333334" y2="610" />
    </g>

    <!-- horizontal lines: y = 50 + i*cellSize -->
    <g>
      <line x1="50" y1="50" x2="610" y2="50" />
      <line x1="50" y1="76.6666667" x2="610" y2="76.6666667" />
      <line x1="50" y1="103.3333334" x2="610" y2="103.3333334" />
      <line x1="50" y1="130.0000001" x2="610" y2="130.0000001" />
      <line x1="50" y1="156.6666668" x2="610" y2="156.6666668" />
      <line x1="50" y1="183.3333335" x2="610" y2="183.3333335" />
      <line x1="50" y1="210.0000002" x2="610" y2="210.0000002" />
      <line x1="50" y1="236.6666669" x2="610" y2="236.6666669" />
      <line x1="50" y1="263.3333336" x2="610" y2="263.3333336" />
      <line x1="50" y1="290.0000003" x2="610" y2="290.0000003" />
      <line x1="50" y1="316.666667" x2="610" y2="316.666667" />
      <line x1="50" y1="343.3333337" x2="610" y2="343.3333337" />
      <line x1="50" y1="370.0000004" x2="610" y2="370.0000004" />
      <line x1="50" y1="396.6666671" x2="610" y2="396.6666671" />
      <line x1="50" y1="423.3333338" x2="610" y2="423.3333338" />
      <line x1="50" y1="450.0000005" x2="610" y2="450.0000005" />
      <line x1="50" y1="476.6666672" x2="610" y2="476.6666672" />
      <line x1="50" y1="503.3333339" x2="610" y2="503.3333339" />
      <line x1="50" y1="530.0000006" x2="610" y2="530.0000006" />
      <line x1="50" y1="556.6666673" x2="610" y2="556.6666673" />
      <line x1="50" y1="583.333334" x2="610" y2="583.333334" />
    </g>
  </g>

  <!-- Example stones: we'll place a small black group that has no EMPTY liberties because all adjacent playable cells are occupied by WHITE or WALL -->
  <!-- playable coordinates (1..19) map to grid indices (1..19) -> SVG position: x = 50 + index*cellSize - cellSize/2 (center) -->
  <!-- We'll place black stones at playable coords (10,10) and (11,10) (two adjacent stones) -->
  <!-- Surround with white stones on all orthogonal neighbors so no liberties -->

  <!-- helper: cell center offset = 50 + i*cellSize + cellSize/2? Actually grid lines at 50 + i*cellSize; centers are + cellSize/2 -->
  <!-- center of cell (r,c) where r and c are 0..20: cx = 50 + c*cellSize + cellSize/2 -->
  <!-- For playable (10,10) playable index=10 -> corresponding grid index = 10 -> use that -->

  <!-- compute numeric centers for the chosen stones -->
  <!-- cellSize = 26.6666667; half = 13.33333335 -->

  <!-- Stone centers for playable coord (10,10) -> grid index 10 -> cx = 50 + 10*26.6666667 + 13.33333335 = 50 + 266.666667 + 13.33333335 = 330.00000035 ~ 330 -->
  <!-- For simplicity we use these rounded positions -->

  <!-- Black stones -->
  <g>
    <!-- black stone at playable (10,10) -->
    <circle cx="330" cy="330" r="11" class="stone-black" />
    <!-- black stone at playable (11,10) (x one cell to right) -->
    <circle cx="356.6666667" cy="330" r="11" class="stone-black" />
  </g>

  <!-- Surrounding white stones (N,S,E,W of both stones) -->
  <g>
    <!-- neighbors around (10,10) -->
    <!-- north at (10,9) -->
    <circle cx="330" cy="303.3333333" r="11" class="stone-white" />
    <!-- south at (10,11) -->
    <circle cx="330" cy="356.6666667" r="11" class="stone-white" />
    <!-- west at (9,10) -->
    <circle cx="303.3333333" cy="330" r="11" class="stone-white" />
    <!-- east at (11,10) is occupied by black, but to remove liberties around pair we add white at (12,10) and (11,9)/(11,11) -->
    <circle cx="383.3333334" cy="330" r="11" class="stone-white" />
    <circle cx="356.6666667" cy="303.3333333" r="11" class="stone-white" />
    <circle cx="356.6666667" cy="356.6666667" r="11" class="stone-white" />
  </g>

  <!-- Legend and labels -->
  <g transform="translate(630,60)">
    <text class="legend">Legend</text>
    <rect x="0" y="30" width="18" height="18" fill="#888" stroke="#000" />
    <text x="26" y="44" class="label">WALL (outer ring)</text>
    <circle cx="9" cy="74" r="8" class="stone-black" />
    <text x="26" y="79" class="label">BLACK stone</text>
    <circle cx="9" cy="104" r="8" class="stone-white" />
    <text x="26" y="109" class="label">WHITE stone</text>
    <text x="0" y="140" class="label">Playable coords are 1..19 (1-based)</text>
    <text x="0" y="160" class="label">This SVG shows a two-stone BLACK group at (10,10)+(11,10)</text>
    <text x="0" y="178" class="label">All orthogonal neighbors are WHITE or WALL so the group has no EMPTY liberties.</text>
  </g>

</svg>