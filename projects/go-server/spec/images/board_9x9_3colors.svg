<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'>
  <style>
    .bg{fill:#DEB887}
    .line{stroke:#333;stroke-width:2}
    .black{fill:#000}
    .white{fill:#fff;stroke:#333;stroke-width:1}
    .red{fill:#E53935}
  </style>
  <!-- 9x9 intersections: margin=60, span=480, spacing=60 (8 intervals) -->
  <rect x='0' y='0' width='600' height='600' fill='#f7f2eb'/>
  <rect x='60' y='60' width='480' height='480' class='bg' />

  <!-- draw 9 vertical and 9 horizontal lines (intersections = 9) -->
  <g fill='none' stroke='#333' stroke-width='2'>
    <!-- vertical lines x = 60 + i*60 for i=0..8 -->
    <line x1='60' y1='60' x2='60' y2='540' />
    <line x1='120' y1='60' x2='120' y2='540' />
    <line x1='180' y1='60' x2='180' y2='540' />
    <line x1='240' y1='60' x2='240' y2='540' />
    <line x1='300' y1='60' x2='300' y2='540' />
    <line x1='360' y1='60' x2='360' y2='540' />
    <line x1='420' y1='60' x2='420' y2='540' />
    <line x1='480' y1='60' x2='480' y2='540' />
    <line x1='540' y1='60' x2='540' y2='540' />

    <!-- horizontal lines y = 60 + i*60 for i=0..8 -->
    <line x1='60' y1='60' x2='540' y2='60' />
    <line x1='60' y1='120' x2='540' y2='120' />
    <line x1='60' y1='180' x2='540' y2='180' />
    <line x1='60' y1='240' x2='540' y2='240' />
    <line x1='60' y1='300' x2='540' y2='300' />
    <line x1='60' y1='360' x2='540' y2='360' />
    <line x1='60' y1='420' x2='540' y2='420' />
    <line x1='60' y1='480' x2='540' y2='480' />
    <line x1='60' y1='540' x2='540' y2='540' />
  </g>

  <!-- stones centered on intersections (1-based coords map to indices 0..8) -->
  <!-- stone radius = 18 -->
  <!-- BLACK at (5,5) -> index (4,4): x=60+4*60=300, y=300 -->
  <circle cx='300' cy='300' r='18' class='black'/>
  <!-- WHITE at (5,6) -> x=300, y=60+(6-1)*60=360 -->
  <circle cx='300' cy='360' r='18' class='white'/>
  <!-- RED at (6,5) -> x=360, y=300 -->
  <circle cx='360' cy='300' r='18' class='red'/>

  <!-- legend -->
  <text x='60' y='580' font-family='sans-serif' font-size='14' fill='#222'>Playable intersections are 1..9 (1-based). Stones are centered on intersections; BLACK=(5,5), WHITE=(5,6), RED=(6,5).</text>
</svg>
