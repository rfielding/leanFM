  <text x='60' y='585' font-family='sans-serif' font-size='14' fill='#222'>9x9 intersections. Stones radius=29 (almost-touch, diameter=58; ~2px gap). Empty gaps are where surrounded groups were removed in this random-play canvas.</text>
