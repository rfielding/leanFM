<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'>
  <style>
    .bg{fill:#f7f2eb}
    .board{fill:#DEB887}
    .line{stroke:#333;stroke-width:2}
    .black{fill:#000}
    .white{fill:#fff;stroke:#333;stroke-width:1}
    .red{fill:#E53935}
    .shadow{fill:rgba(0,0,0,0.12)}
  </style>
  <rect width='600' height='600' fill='#f7f2eb'/>
  <rect x='60' y='60' width='480' height='480' class='board' rx='6' ry='6'/>

  <!-- grid lines (9x9 intersections) -->
  <g fill='none' stroke='#333' stroke-width='2'>
    <!-- verticals -->
    <line x1='60' y1='60' x2='60' y2='540' />
    <line x1='120' y1='60' x2='120' y2='540' />
    <line x1='180' y1='60' x2='180' y2='540' />
    <line x1='240' y1='60' x2='240' y2='540' />
    <line x1='300' y1='60' x2='300' y2='540' />
    <line x1='360' y1='60' x2='360' y2='540' />
    <line x1='420' y1='60' x2='420' y2='540' />
    <line x1='480' y1='60' x2='480' y2='540' />
    <line x1='540' y1='60' x2='540' y2='540' />
    <!-- horizontals -->
    <line x1='60' y1='60' x2='540' y2='60' />
    <line x1='60' y1='120' x2='540' y2='120' />
    <line x1='60' y1='180' x2='540' y2='180' />
    <line x1='60' y1='240' x2='540' y2='240' />
    <line x1='60' y1='300' x2='540' y2='300' />
    <line x1='60' y1='360' x2='540' y2='360' />
    <line x1='60' y1='420' x2='540' y2='420' />
    <line x1='60' y1='480' x2='540' y2='480' />
    <line x1='60' y1='540' x2='540' y2='540' />
  </g>

  <!-- stones: r=29 (almost-touch, diameter=58) -->
  <!-- layout rows 0..8, cols 0..8 -->
  <!-- B W R B W R B W B -->
  <!-- W R B W R B W R W -->
  <!-- R B W R B W R B R -->
  <!-- B W R B . R B W B -->
  <!-- W R B W R B W R W -->
  <!-- R B W R B W R B R -->
  <!-- B W R B W R B W B -->
  <!-- W R B W R B W R W -->
  <!-- R B . R B W R B R -->

  <g>
    <!-- row 0 -->
    <circle cx='60'  cy='60'  r='29' class='black'/>
    <circle cx='120' cy='60'  r='29' class='white'/>
    <circle cx='180' cy='60'  r='29' class='red'/>
    <circle cx='240' cy='60'  r='29' class='black'/>
