          "403": {
            "description": "Terminal outcome; Host/Origin admission failures are plain HTTP 403",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "429": {
            "description": "Terminal outcome; Host/Origin admission failures are plain HTTP 403",
            "content": {
