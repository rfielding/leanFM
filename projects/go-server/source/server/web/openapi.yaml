    "/api/export": {
      "post": {
        "operationId": "export_gif",
        "x-leanfm-requirement": "spec/Requirements.lean#export_gif",
        "description": "same-origin; replayed local actions; no arbitrary path input. image/gif on success; X-GoServer-Artifact and X-GoServer-Final-Ply; text/plain error; X-GoServer-Trace is base64 UTF-8 JSON request/terminal Event array on both outcomes",
        "responses": {
          "200": {
            "description": "image/gif on success; X-GoServer-Artifact and X-GoServer-Final-Ply; text/plain error; X-GoServer-Trace is base64 UTF-8 JSON request/terminal Event array on both outcomes",
            "content": {
              "image/gif": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "headers": {
              "X-GoServer-Trace": {
                "description": "Base64 JSON TraceEvent array, including direct cause/prior links",
                "schema": {
                  "type": "string"
                }
              },
              "X-GoServer-Artifact": {
                "schema": {
                  "type": "string"
                }
              },
              "X-GoServer-Final-Ply": {
                "schema": {
                  "type": "string"
