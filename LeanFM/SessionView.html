<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeanFM session</title>
<style>
  :root, :root[data-theme="dark"] {
    --bg: #0b0f14; --panel: #16202b; --edge: #263445; --fg: #eceae6; --dim: #9aa6b2;
    --good: #4ade80; --bad: #f87171; --amber: #fbbf24; --cyan: #67e8f9;
    --ink-bg: #0b0f14; --ink-fg: #e5e7eb; --ink-line: #4b5563; --ink-arrow: #93c5fd;
    --ink-frame: #fbbf24; --ink-muted: #9ca3af; --ink-actFill: #1f2937; --ink-hl: #f472b6;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f4f5f7; --edge: #d5dae1; --fg: #1d2430; --dim: #5d6876;
    --good: #15803d; --bad: #b91c1c; --amber: #b45309; --cyan: #0e7490;
    --ink-bg: #ffffff; --ink-fg: #111827; --ink-line: #9ca3af; --ink-arrow: #1d4ed8;
    --ink-frame: #b45309; --ink-muted: #4b5563; --ink-actFill: #f3f4f6; --ink-hl: #be185d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px 16px 16px; display: grid; gap: 12px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .tool { font-weight: 600; }
  .badge { border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 8px; font-weight: 700; font-size: 13px; }
  .ok { color: var(--good); } .issues { color: var(--bad); } .other { color: var(--amber); }
  .reading { margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  h3 { margin: 0 0 6px; font-size: 12.5px; color: var(--dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  pre { margin: 0; font: 13px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; white-space: pre; overflow-x: auto; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .issue { color: var(--bad); }
  .scroll { overflow-x: auto; }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button.fold { font-size: 12px; padding: 1px 8px; margin: 2px 0 4px; }
  button.foldhead { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; margin: 0 0 6px;
    padding: 4px 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); border-color: var(--ink-arrow); }
  button.foldhead .hint { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--dim); }
  svg rect.hot:hover, svg rect.hot:focus-visible { stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 3; fill: var(--amber); fill-opacity: .08; outline: none; }
  button, select { background: var(--panel); color: var(--fg); border: 1px solid var(--edge); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--amber); }
  .pos { color: var(--dim); font: 13px ui-monospace, Menlo, monospace; }
  .evbox { max-height: 16em; overflow-y: auto; }
  .evlist { margin: 0; padding-left: 3em; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  .evlist li { cursor: pointer; color: var(--dim); }
  .evlist li.mine { color: var(--fg); }
  .evlist li.mine::marker { color: var(--amber); }
  .evlist li.mine::before { content: "● "; color: var(--amber); }
  .evlist li.on { background: var(--panel); outline: 2px solid var(--amber); color: var(--fg); }
  canvas { display: block; width: 100%; height: 420px; background: var(--panel); border-radius: 8px; }
  .detail { font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); white-space: pre-wrap; }
  .meta, .more { color: var(--dim); font-size: 13px; }
  .err { color: var(--bad); }
  textarea { width: 100%; min-height: 320px; resize: vertical; background: var(--bg); color: var(--fg);
    border: 1px solid var(--edge); border-radius: 6px; padding: 8px 10px;
    font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; tab-size: 2; }
  textarea:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .snips { display: flex; flex-wrap: wrap; gap: 6px; }
  .snips button { font: 13px ui-monospace, Menlo, monospace; padding: 2px 8px; }
  .edit-status { font-size: 13px; color: var(--dim); min-height: 1.4em; }
  .edit-status.bad { color: var(--bad); } .edit-status.good { color: var(--good); }
  .walk-steps { margin: 0 0 8px; padding-left: 26px; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  .walk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
  .walk-role { min-width: 9em; font-weight: 600; }
  button.step { font-size: 15px; padding: 6px 14px; border-color: var(--ink-arrow); }
  button.step.choice { border-color: var(--amber); border-width: 2px; }
  .walk-wait { color: var(--dim); font-size: 14px; }
  .walk-end { color: var(--good); font-weight: 600; }
  .sketch svg { display: block; width: 100%; height: 150px; background: var(--bg); border-radius: 6px; }
  .sketch .lane { cursor: pointer; }
  .sketch-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .sketch-form input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 8px; font: 15px ui-monospace, Menlo, monospace; min-width: 9em; }
  .sketch-hint { font-size: 14px; color: var(--dim); margin: 6px 0 0; }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .nav .group { min-width: 6.5em; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .propform { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .propform textarea { min-height: 3.5em; font: 13px ui-monospace, Menlo, monospace; }
  .nav button.on { border-color: var(--amber); border-width: 2px; font-weight: 600; }
  .nav input[type=number] { width: 7em; background: var(--bg); color: var(--fg); border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 6px; font: inherit; }
  table.rows { border-collapse: collapse; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  table.rows th, table.rows td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--edge); }
  table.rows th { color: var(--dim); font-weight: 600; }
  .chart svg { display: block; width: 100%; height: auto; }
  .code-tools { display: flex; gap: 8px; margin-bottom: 6px; }
  canvas.tree, canvas.machine { height: 560px; cursor: grab; }
  canvas.machine { height: 480px; }
  .moves { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .moves button { font: 14px ui-monospace, Menlo, monospace; }
  canvas.tree.dragging { cursor: grabbing; }
  .src { counter-reset: none; }
  .src .ln { color: var(--dim); user-select: none; display: inline-block; min-width: 3.5em; }
  details > summary { cursor: pointer; color: var(--dim); }
</style>
</head>
<body>
<main id="app"><div id="editor"></div><div id="walk"></div><div id="results"><p class="meta">Waiting for a session tool result…</p></div></main>
<script>
"use strict";
// Draws session_check, session_diagram and session_simulate results. Tool data is placed only as
// text nodes, SVG geometry built with createElementNS, and canvas drawing. No network.
const MAX_SHAPES = 4000, MAX_EVENTS = 600, MAX_ITEMS = 64;
// The editor may call only these tools, one call at a time, with text that parses as JSON.
const EDIT_TOOLS = ["session_check", "session_simulate", "session_mdp", "session_actor", "session_dataset", "session_types", "session_explore", "session_review", "session_ctl", "session_sla", "session_instances", "session_skeleton"], MAX_EDIT_BYTES = 65536, EDIT_PAUSE_MS = 700;
// A dataset is generated by LeanFM and only its summary comes back; at most MAX_DATASET sessions.
const MAX_DATASET = 10000, MAX_LABEL = 96;
// The tree canvas draws at most MAX_TREE nodes and shows at most MAX_SOURCE lines of a node's source.
const MAX_TREE = 1500, MAX_SOURCE = 80;
// A state machine draws at most MAX_STATES states; above FOCUS_STATES only those within FOCUS_RADIUS
// transitions of the current state are drawn, so a machine too large to show stays explorable.
const MAX_STATES = 400, FOCUS_STATES = 60, FOCUS_RADIUS = 2;
const app = document.getElementById("app");
const editorBox = document.getElementById("editor"), results = document.getElementById("results");
const walkBox = document.getElementById("walk");
// The walk-through calls only session_next, one call at a time, with at most MAX_WALK events.
const WALK_TOOL = "session_next", MAX_WALK = 200;

// ---- JSON-RPC over postMessage --------------------------------------------------------------
let currentOverlay = null;
let nextId = 1;
const pending = new Map();
function send(msg) { window.parent.postMessage(msg, "*"); }
function rpc(method, params, timeoutMs) {
  const id = nextId++;
  send({ jsonrpc: "2.0", id, method, params });
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error("timeout")); } }, timeoutMs);
  });
}
function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  let msg = event.data;
  if (typeof msg === "string") { try { msg = JSON.parse(msg); } catch (_) { return; } }
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.method === undefined && msg.id !== undefined) {
    const p = pending.get(msg.id);
    if (p) { pending.delete(msg.id); msg.error ? p.reject(msg.error) : p.resolve(msg.result); }
    return;
  }
  const params = msg.params || {};
  switch (msg.method) {
    case "ui/notifications/tool-input": break;
    case "ui/notifications/tool-result": show(params); break;
    case "ui/notifications/host-context-changed": theme(params); break;
    case "ui/notifications/tool-cancelled": status("The tool call was cancelled."); break;
    default:
      if (msg.id !== undefined) send({ jsonrpc: "2.0", id: msg.id, result: {} });
  }
});

function theme(ctx) {
  if (ctx && (ctx.theme === "light" || ctx.theme === "dark")) {
    document.documentElement.dataset.theme = ctx.theme;
    if (anim) anim.recolor();
  }
}

async function connect() {
  let delay = 400; const started = Date.now();
  while (Date.now() - started < 30000) {
    try {
      const result = await rpc("ui/initialize", {
        appInfo: { name: "leanfm-session-view", version: "1.0.0" },
        appCapabilities: { availableDisplayModes: ["inline"] },
        protocolVersion: "2026-01-26" }, delay);
      theme(result && result.hostContext);
      notify("ui/notifications/initialized", {});
      return;
    } catch (_) { delay = Math.min(delay * 2, 5000); }
  }
  status("Could not connect to the host.", true);
}

let lastHeight = 0;
function reportSize() {
  const height = Math.ceil(app.getBoundingClientRect().bottom);
  if (height !== lastHeight) {
    lastHeight = height;
    notify("ui/notifications/size-changed", { width: Math.ceil(document.documentElement.scrollWidth), height });
  }
}
if (typeof ResizeObserver === "function") new ResizeObserver(reportSize).observe(document.body);

// ---- DOM helpers: text only ----------------------------------------------------------------
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text) {
  const node = document.createElementNS(SVGNS, tag);
  for (const k in attrs) node.setAttribute(k, String(attrs[k]));
  if (text !== undefined) node.textContent = String(text);
  return node;
}
function status(text, bad) { results.replaceChildren(el("p", bad ? "err" : "meta", text)); reportSize(); }
function panel(title, child) { const p = el("div", "panel"); p.appendChild(el("h3", "", title)); p.appendChild(child); return p; }
// A panel whose whole header is a button that says what it does: hide or show what is under it.
function foldPanel(title, child, open) {
  const p = el("div", "panel"), b = el("button", "foldhead"), mark = el("span"), name = el("span", "", title), hint = el("span", "hint");
  b.append(mark, name, hint);
  const set = (on) => { child.hidden = !on; mark.textContent = on ? "▾" : "▸"; hint.textContent = on ? "click to hide" : "click to show";
    b.setAttribute("aria-expanded", String(on)); };
  set(open !== false);
  b.addEventListener("click", () => { set(child.hidden); reportSize(); });
  p.append(b, child);
  return p;
}
// LeanFM's drawing as shapes the view can fold and click; failing that, its SVG as an image.
function drawing(r, opts) {
  if (r && r.diagram && Array.isArray(r.diagram.shapes)) return diagram(r.diagram, opts);
  if (r && typeof r.svg === "string" && r.svg.startsWith("<svg")) {
    const box = el("div", "scroll"), img = el("img");
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(r.svg); img.alt = String(r.reading || "sequence diagram");
    box.appendChild(img); return box;
  }
  const why = Array.isArray(r && r.omitted) && r.omitted.length ? " LeanFM left out: " + r.omitted.join(", ") + "." : "";
  return el("p", "err", "No drawing came back for this protocol." + why);
}

const INKS = ["bg", "fg", "line", "arrow", "frame", "muted", "actFill"];
function ink(name) { return INKS.includes(name) ? `var(--ink-${name})` : "none"; }
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

// A collapse button over a drawing: the drawing folds away, the button stays to bring it back.
function collapsible(what, child) {
  const wrap = el("div"), b = el("button", "fold", "▾ Collapse " + what);
  b.setAttribute("aria-expanded", "true");
  b.addEventListener("click", () => {
    const open = child.hidden; child.hidden = !open;
    b.textContent = (open ? "▾ Collapse " : "▸ Show ") + what;
    b.setAttribute("aria-expanded", String(open)); reportSize();
  });
  wrap.append(b, child);
  return wrap;
}

// ---- the sequence diagram, interactive ----------------------------------------------------------
// LeanFM draws the diagram; the view only folds it. A frame (alt, par, loop, sessions, ref) is a
// rect classed "frame <kind>" with its tab on its top edge. Folding a frame squeezes everything
// between its header and its bottom edge to nothing and lifts what lies below, so lifelines and
// activation bars shorten instead of breaking. An included protocol (ref) starts folded; a click on
// a frame's header folds or opens it; "states" on a ref frame folds it and shows its roles' state
// machines below; a click on an actor shows that actor's state machine in the protocol drawn.
const FRAME_HEAD = 26, FRAME_FOOT = 6;
function rolesOfProtocol(name) {
  const src = text ? text.value : "";
  const re = new RegExp("protocol\\s+" + name.replace(/[.]/g, "\\.") + "\\s*\\(([^)]*)\\)");
  const m = src.match(re);
  return m ? m[1].split(",").map((x) => x.trim()).filter((x) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(x)) : [];
}
function diagram(model, opts) {
  if (!model || !Array.isArray(model.shapes)) return el("p", "meta", "No diagram in this result.");
  opts = opts || {};
  const shapes = model.shapes.slice(0, MAX_SHAPES).filter((s) => s && typeof s === "object");
  const w = num(model.width), h0 = num(model.height);
  // the frames, outermost first; a ref frame's caption names the protocol it includes
  const frames = [];
  for (const s of shapes) {
    if (s.k !== "rect" || typeof s.cls !== "string" || !s.cls.startsWith("frame ")) continue;
    const f = { kind: s.cls.slice(6), x: num(s.x), y: num(s.y), w: num(s.w), h: num(s.h), name: "" };
    const cap = shapes.find((t) => t.k === "text" && num(t.y) === f.y + 13 && num(t.x) > f.x + 8 && num(t.x) < f.x + f.w && typeof t.text === "string" && t.text.startsWith("["));
    if (cap) f.name = cap.text.replace(/^\[|\]$/g, "");
    f.mode = f.kind === "ref" ? "hidden" : "open";
    frames.push(f);
  }
  frames.sort((a, b) => (a.y - b.y) || (b.h - a.h));
  // ---- the source each drawn part comes from, as the explorer's tree finds it: within the protocol
  // that owns the part (the innermost included protocol around it, else the one drawn), the next
  // line, in drawing order, that has the part's message ("Label from"), event ("Label at") or
  // keyword (choice, rec, par, sessions, include Name)
  const srcLines = String(typeof opts.source === "string" ? opts.source : (text ? text.value : "")).split("\n");
  const defOf = (name) => (Array.isArray(opts.defs) ? opts.defs : []).find((d) => d && d.name === name);
  const ownerAt = (y, self) => {
    let best = null;
    for (const f of frames) if (f !== self && f.kind === "ref" && f.name && y > f.y && y < f.y + f.h && (!best || f.h < best.h)) best = f;
    return best ? best.name : (opts.focus || "");
  };
  const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const blockEnd = (from, last) => {
    let depth = 0, opened = false;
    for (let i = from; i <= last; i++) {
      for (const ch of srcLines[i - 1] || "") { if (ch === "{") { depth++; opened = true; } else if (ch === "}") depth--; }
      if (opened && depth <= 0) return i;
    }
    return from;
  };
  const stmtEnd = (from, last) => { for (let i = from; i <= last; i++) if ((srcLines[i - 1] || "").includes(";")) return i; return from; };
  const items = [];
  for (let i = 0; i < shapes.length; i++) {
    const s = shapes[i];
    const isMsg = (s.k === "line" || s.k === "path") && /\bmsg\b/.test(s.cls || "");
    const isAct = s.k === "rect" && s.cls === "act";
    if (!isMsg && !isAct) continue;
    const lab = shapes.slice(i + 1, i + 3).find((t) => t.k === "text" && typeof t.text === "string");
    if (!lab) continue;
    const y = s.k === "line" ? num(s.y1) : s.k === "rect" ? num(s.y) : Number((String(s.d).match(/^M\s*-?[0-9.]+\s+(-?[0-9.]+)/) || [])[1]) + 8;
    const label = isMsg ? lab.text.replace(/^[A-Za-z_][A-Za-z0-9_]*: /, "").split(" - ")[0] : lab.text;
    items.push({ y, shape: s, label: lab, what: (isMsg ? "message " : "event ") + label,
      re: new RegExp("(^|[^A-Za-z0-9_])" + esc(label) + (isMsg ? " from\\b" : " at\\b")), block: false });
  }
  const KW = { alt: /\bchoice\b/, loop: /\brec\s+[A-Za-z_]/, sessions: /\bsessions\b/, par: /\bpar\b/, join: /\bpar\b/ };
  for (const f of frames) {
    const re = f.kind === "ref" ? (f.name ? new RegExp("\\binclude\\s+" + esc(f.name) + "\\b") : null) : KW[f.kind];
    if (re) items.push({ y: f.y, frame: f, re, block: true, what: (f.kind === "ref" ? "include " + f.name : f.kind + " frame") });
  }
  items.sort((a, b) => a.y - b.y);
  const cursor = new Map();
  for (const it of items) {
    const P = ownerAt(it.y, it.frame), d = defOf(P);
    if (!d || !Number.isInteger(d.first) || !Number.isInteger(d.last)) continue;
    let at = cursor.has(P) ? cursor.get(P) : d.first;
    for (let i = at; i <= d.last; i++) {
      if (it.re.test(srcLines[i - 1] || "")) {
        it.range = { protocol: P, first: i, last: it.block ? blockEnd(i, d.last) : stmtEnd(i, d.last) };
        cursor.set(P, i + 1);
        break;
      }
    }
    if (it.frame && it.range) it.frame.range = it.range;
  }
  let select = Array.isArray(opts.select) ? opts.select : [];
  const lit = (rg) => !!rg && select.some((q) => q.protocol === rg.protocol && q.first <= rg.last && q.last >= rg.first && !(rg.first < q.first && rg.last > q.last && items.some((o) => o.frame && o.range === rg)));
  const openAround = () => {
    for (const it of items) if (!it.frame && lit(it.range)) for (const f of frames) if (it.y > f.y && it.y < f.y + f.h) f.mode = "open";
  };
  openAround();
  let scrolled = false;
  const body = el("div"), scroll = el("div", "scroll"), below = el("div");
  body.append(scroll, below);
  const box = collapsible("interaction diagram", body);
  // jumping into an included protocol: the caller may take it (the tree selects that protocol);
  // otherwise this drawing is replaced by the included protocol's own, with a trail back
  const trail = [], crumbs = el("div", "controls crumbs"), holder = el("div");
  const enter = typeof opts.onEnter === "function" ? opts.onEnter : (name) => { trail.push(name); goTo(); };
  function goTo() {
    if (!trail.length) { body.replaceChildren(scroll, below); render(); return; }
    const names = [opts.focus || "whole protocol"].concat(trail);
    crumbs.replaceChildren(el("span", "meta", "In:"));
    names.forEach((nm, i) => {
      if (i) crumbs.appendChild(el("span", "meta", ">"));
      const b = el("button", i === names.length - 1 ? "on" : "", nm);
      b.setAttribute("aria-label", i === names.length - 1 ? "Showing " + nm : "Back to " + nm);
      if (i < names.length - 1) b.addEventListener("click", () => { trail.length = i; goTo(); });
      crumbs.appendChild(b);
    });
    const name = trail[trail.length - 1];
    body.replaceChildren(crumbs, holder);
    askInto(holder, "session_explore", { focus: name }, (r) => drawing(r, { focus: name, defs: opts.defs, source: opts.source,
      onEnter: (n) => { trail.push(n); goTo(); } }));
  }
  const machinesOf = (title, protocol, roles) => {
    const pnl = el("div");
    for (const r of roles) {
      const out = el("div");
      pnl.appendChild(panel("State machine of " + r + (protocol ? " in " + protocol : ""), out));
      askInto(out, "session_explore", Object.assign({ states: r }, protocol ? { focus: protocol } : {}), machineView);
    }
    return pnl;
  };
  function render() {
    // the folded regions: inside the header of each folded frame that no folded frame contains
    const folded = [];
    for (const f of frames) {
      if (f.mode === "open") continue;

  const source = text.value;

  if (new Blob([source]).size > MAX_EDIT_BYTES) { say("The protocol is over 64 KiB.", "bad"); return; }

  }
  restart.addEventListener("click", () => { events.length = 0; states.length = 0; edges.length = 0; finals.length = 0; seen.clear(); log.replaceChildren(); stepNo = 0; if (onStep) onStep(null); ask(); });
  undo.addEventListener("click", () => { if (!events.length) return; events.pop(); log.lastChild && log.removeChild(log.lastChild); ask(); });
  ask();
}

// ---- the sketch: add messages by clicking lifelines; LeanFM draws the real diagram ------------
// The sketch shows only the roles' lifelines. Each click pair adds one statement to the protocol
// text (at the cursor, or before the protocol's closing brace), and LeanFM rechecks it: every
// diagram on the page is still the one LeanFM generates from the text.
let sketchBox = null, caret = null, pick = null;
const IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/, ROUTE = /^(GET|PUT|POST|DELETE|PATCH|HEAD|OPTIONS) \/[A-Za-z0-9_\-\/{}.~:]*$/;
// Where a new statement goes: after the line holding the cursor, or, with no cursor, on its own line
// just above the closing brace of the last protocol (or of a sessions block that ends its body).
function placement(src) {
  if (caret !== null && caret >= 0 && caret <= src.length) {
    const start = src.lastIndexOf("\n", caret - 1) + 1, nl = src.indexOf("\n", caret), end = nl < 0 ? src.length : nl;
    const line = src.slice(start, end), indent = (line.match(/^\s*/) || [""])[0] + (line.trimEnd().endsWith("{") ? "  " : "");
    return { at: end, before: "\n" + indent, after: "" };
  }
  let close = src.lastIndexOf("}");
  if (close < 0) return { at: src.length, before: "\n", after: "" };
  const inner = src.slice(0, close).trimEnd();
  if (inner.endsWith("}") && /sessions\s*\{/.test(src)) close = inner.length - 1;
  const start = src.lastIndexOf("\n", close - 1) + 1;
  const closeIndent = (src.slice(start, close).match(/^\s*/) || [""])[0];
  if (src.slice(start, close).trim() !== "") {
    // the brace shares its line with text (`{ }` on one line): break it, dropping the space before it
    let from = close; while (from > 0 && src[from - 1] === " ") from--;
    return { at: from, cut: close, before: "\n" + closeIndent + "  ", after: "\n" + closeIndent };
  }
  return { at: start, before: closeIndent + "  ", after: "\n" };
}
function insertLine(line) {
  const src = text.value, p = placement(src);
  const piece = p.before + line + p.after;
  text.value = src.slice(0, p.at) + piece + src.slice(p.cut === undefined ? p.at : p.cut);
  caret = p.at + p.before.length + line.length;
  schedule(); drawSketch();
}
function insertionPoint(src) { return placement(src).at; }
function usedIds(src) { return new Set([...src.matchAll(/(^|[\s;{])([a-z][A-Za-z0-9_]*):\s*[A-Za-z_]/g)].map((m) => m[2])); }
function freshId(label, src) {
  const used = usedIds(src); let base = label.charAt(0).toLowerCase() || "m", id = base, n = 2;
  while (used.has(id)) id = base + n++;
  return id;
}
function lastRequest(src, from, to) {
  // the latest `id: Label from <from> to <to>` before the insertion point: what a reply answers
  const upTo = src.slice(0, insertionPoint(src));
  // a statement with a cause is itself a reply, so only causeless ones are requests to answer
  const re = new RegExp("([a-z][A-Za-z0-9_]*):\\s*([A-Za-z_][A-Za-z0-9_]*)\\s+from\\s+" + from + "\\s+to\\s+" + to + "\\b([^;]*);", "g");
  let m, last = null;
  while ((m = re.exec(upTo))) if (!/\bcause\b/.test(m[3])) last = { id: m[1], label: m[2] };
  return last;
}
function drawSketch() {
  if (!sketchBox || !text) return;
  const roles = rolesOf(text.value);
  const W = 760, H = 150, m = 70, step = roles.length > 1 ? (W - 2 * m) / (roles.length - 1) : 0;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Lifelines of " + roles.join(", ") });
  roles.forEach((r, i) => {
    const x = roles.length > 1 ? m + i * step : W / 2, chosen = pick === r;
    const g = sv("g", { class: "lane", tabindex: 0, role: "button", "aria-label": (pick ? "to " : "from ") + r, "data-role": r });
    g.appendChild(sv("rect", { x: x - 40, y: 0, width: 80, height: H, fill: "transparent" }));
    g.appendChild(sv("rect", { x: x - 46, y: 10, width: 92, height: 30, rx: 5, fill: "var(--ink-actFill)", stroke: chosen ? "var(--amber)" : "var(--ink-fg)", "stroke-width": chosen ? 3 : 1 }));
    g.appendChild(sv("text", { x, y: 30, "text-anchor": "middle", fill: "var(--ink-fg)", "font-size": 15 }, r));
    g.appendChild(sv("line", { x1: x, y1: 40, x2: x, y2: H - 6, stroke: chosen ? "var(--amber)" : "var(--ink-line)", "stroke-width": chosen ? 3 : 1.5, "stroke-dasharray": "5 5" }));
    const go = () => sketchClick(r);
    g.addEventListener("click", go);
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
    svg.appendChild(g);
  });
  const parts = [svg];
  const addRole = el("div", "sketch-form"), roleIn = el("input"), roleBtn = el("button", "", "Add role");
  roleIn.type = "text"; roleIn.placeholder = "NewRole"; roleIn.setAttribute("aria-label", "Name of a role to add");
  roleBtn.addEventListener("click", () => {
    const r = roleIn.value.trim();
    if (!IDENT.test(r) || roles.includes(r)) { say(IDENT.test(r) ? r + " is already a role." : "A role name is a letter followed by letters, digits or _.", "bad"); return; }
    const all = [...text.value.matchAll(/protocol\s+[^\s(]+\s*\(([^)]*)\)/g)];
    if (!all.length) { say("Add a protocol line first: protocol Name (A, B) { }", "bad"); return; }
    const last = all[all.length - 1], at = last.index + last[0].length - 1;
    text.value = text.value.slice(0, at) + (last[1].trim() ? ", " : "") + r + text.value.slice(at);
    schedule(); drawSketch();
  });
  addRole.append(roleIn, roleBtn);
  parts.push(pick ? sketchForm(pick) : el("p", "sketch-hint", "Click a lifeline to start a message, the same one twice for an event. New lines go at the cursor in the text, or at the end."), addRole);
  sketchBox.replaceChildren(...parts);
  reportSize();
}
let target = null;
function sketchClick(r) {
  if (!pick) { pick = r; target = null; drawSketch(); return; }
  target = r; drawSketch();
  const input = sketchBox.querySelector ? sketchBox.querySelector("input[data-field=label]") : null;
  if (input && input.focus) input.focus();
}
function sketchForm(from) {
  const box = el("div");
  if (!target) { box.appendChild(el("p", "sketch-hint", `From ${from}: now click the receiver (or ${from} again for an event).`)); return box; }
  const to = target, isEvent = to === from;
  const form = el("div", "sketch-form");
  const label = el("input"); label.type = "text"; label.placeholder = "Label"; label.dataset.field = "label";
  label.setAttribute("aria-label", "Label of the " + (isEvent ? "event" : "message"));
  form.append(el("span", "walk-role", isEvent ? `${from}:` : `${from} → ${to}:`), label);
  const req = isEvent ? null : lastRequest(text.value, to, from);
  let reply = null, route = null, status = null;
  if (!isEvent) {
    route = el("input"); route.type = "text"; route.placeholder = "route, e.g. POST /orders"; route.dataset.field = "route";
    route.setAttribute("aria-label", "HTTP route, optional");
    status = el("input"); status.type = "text"; status.placeholder = "status"; status.size = 5; status.dataset.field = "status";
    status.setAttribute("aria-label", "HTTP status of a reply, optional");
    form.append(route);
    if (req) {
      reply = el("input"); reply.type = "checkbox"; reply.id = "sketch-reply"; reply.checked = true;
      const lab = el("label", "", ` reply to ${req.label}`); lab.setAttribute("for", "sketch-reply");
      form.append(reply, lab, status);
    }
  }
  const add = el("button", "step", "Add"), cancel = el("button", "", "Cancel");
  const commit = () => {
    const l = label.value.trim();
    if (!IDENT.test(l)) { say("A label is a letter followed by letters, digits or _.", "bad"); return; }
    if (isEvent) { insertLine(`${l} at ${from};`); }
    else {
      const r = route && route.value.trim(), st = status && status.value.trim();
      if (r && !ROUTE.test(r)) { say("A route is a method and a path, such as POST /orders.", "bad"); return; }
      if (st && !/^[1-5][0-9][0-9]$/.test(st)) { say("A status is three digits, such as 200.", "bad"); return; }
      const answering = reply && reply.checked && req;
      const id = answering ? "" : freshId(l, text.value) + ": ";
      insertLine(`${id}${l} from ${from} to ${to}` + (answering ? ` cause ${req.id}` : "") + (r ? ` route "${r}"` : "") + (answering && st ? ` status ${st}` : "") + ";");
    }
    pick = null; target = null; drawSketch();
  };
  add.addEventListener("click", commit);
  label.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); commit(); } });
  cancel.addEventListener("click", () => { pick = null; target = null; drawSketch(); });
  form.append(add, cancel);
  box.appendChild(form);
  return box;
}

// ---- the walk-through: play every role, one allowed step at a time ---------------------------
let walkEvents = [], walkBusy = false;
function stepLabel(e) {
  return e.act ? `${e.from}: ${e.label}` : `${e.from} → ${e.to}: ${e.label}`;
}
async function stepWalk() {
  if (!text || walkBusy) return;
  if (!canCall) { walkBox.replaceChildren(panel("Walk through", el("p", "err", "This host does not let the view call tools; ask Claude to run session_next."))); reportSize(); return; }
  walkBusy = true;
  try {
    const result = await rpc("tools/call", { name: WALK_TOOL, arguments: Object.assign({ lean: text.value, events: walkEvents }, currentOverlay ? { overlay: currentOverlay } : {}) }, 30000);
    const body = result && result.structuredContent;
    if (result && result.isError) drawWalk({ verdict: "rejected", reading: String((body && body.reason) || "LeanFM rejected the protocol."), next: [] });
    else if (body && typeof body === "object") drawWalk(body);
  } catch (e) {
    if (e && (e.code === -32601 || e.message === "timeout")) canCall = false;
    drawWalk({ verdict: "rejected", reading: "The walk failed: " + String((e && e.message) || e), next: [] });
  } finally { walkBusy = false; }
}
function drawWalk(body) {
  const box = el("div");
  if (walkEvents.length) {
    const ol = el("ol", "walk-steps");
    const index = new Map(walkEvents.map((e, i) => [e.id, i + 1]));
    for (const e of walkEvents) ol.appendChild(el("li", "", stepLabel(e) + (e.cause && index.has(e.cause) ? `   (cause: ${index.get(e.cause)})` : "")));
    box.appendChild(ol);
  } else box.appendChild(el("p", "meta", "One session from the start. Each button is a step the protocol allows now."));
  const v = String(body.verdict || "");
  box.appendChild(el("p", v === "violates" || v === "rejected" || v === "stuck" ? "err" : v === "finished" ? "walk-end" : "reading", String(body.reading || "")));
  const next = Array.isArray(body.next) ? body.next.slice(0, MAX_ITEMS) : [];
  const roles = Array.isArray(body.roles) ? body.roles.map(String) : [];
  const senders = [...new Set(next.map((n) => String(n.from)))];
  for (const r of senders) {
    const mine = next.filter((n) => String(n.from) === r);
    const row = el("div", "walk-row"), who = el("span", "walk-role");
    // a role with several steps chooses among them; with one it simply may take it
    who.appendChild(document.createTextNode(mine.length > 1 ? r + " chooses" : r));
    row.appendChild(who);
    for (const n of mine) {
      const b = el("button", "step" + (mine.length > 1 ? " choice" : ""), n.act === true ? `${n.label} (event)` : `${n.label} → ${n.to}`);
      b.addEventListener("click", () => {
        if (walkEvents.length >= MAX_WALK) return;
        const ev = { id: "w" + (walkEvents.length + 1), session: "walk", from: String(n.from), label: String(n.label) };
        if (n.act === true) ev.act = true; else ev.to = String(n.to);
        if (typeof n.cause === "string") ev.cause = n.cause;
        walkEvents.push(ev); stepWalk();
      });
      row.appendChild(b);
    }
    box.appendChild(row);
  }
  const waiting = roles.filter((r) => !senders.includes(r));
  if (next.length && waiting.length) box.appendChild(el("p", "walk-wait", `${waiting.join(", ")} ${waiting.length === 1 ? "waits" : "wait"}`));
  if (body.canEnd === true && next.length) box.appendChild(el("p", "walk-end", "The session may also end here."));
  const undo = el("button", "", "Undo"), restart = el("button", "", "Start again"), close = el("button", "", "Close");
  undo.disabled = !walkEvents.length;
  undo.addEventListener("click", () => { walkEvents.pop(); stepWalk(); });
  restart.addEventListener("click", () => { walkEvents = []; stepWalk(); });
  close.addEventListener("click", () => { walkEvents = []; walkBox.replaceChildren(); reportSize(); });
  const controls = el("div", "controls"); controls.append(undo, restart, close);
  box.appendChild(controls);
  walkBox.replaceChildren(panel("Walk through one session", box));
  reportSize();
}

connect();
</script>
