<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeanFM session</title>
<style>
  :root, :root[data-theme="dark"] {
    --bg: #0b0f14; --panel: #16202b; --edge: #263445; --fg: #eceae6; --dim: #9aa6b2;
    --good: #4ade80; --bad: #f87171; --amber: #fbbf24; --cyan: #67e8f9;
    --ink-bg: #0b0f14; --ink-fg: #e5e7eb; --ink-line: #4b5563; --ink-arrow: #93c5fd;
    --ink-frame: #fbbf24; --ink-muted: #9ca3af; --ink-actFill: #1f2937; --ink-hl: #f472b6;
    --stage: #111111; --req: #60a5fa; --rep: #4ade80; --life: #64748b;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #f4f5f7; --edge: #d5dae1; --fg: #1d2430; --dim: #5d6876;
    --good: #15803d; --bad: #b91c1c; --amber: #b45309; --cyan: #0e7490;
    --ink-bg: #ffffff; --ink-fg: #111827; --ink-line: #9ca3af; --ink-arrow: #1d4ed8;
    --ink-frame: #b45309; --ink-muted: #4b5563; --ink-actFill: #f3f4f6; --ink-hl: #be185d;
    --stage: #fbfaf7; --req: #1d4ed8; --rep: #15803d; --life: #94a3b8;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px 16px 16px; display: grid; gap: 12px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .tool { font-weight: 600; }
  .badge { border: 1.5px solid currentColor; border-radius: 6px; padding: 1px 8px; font-weight: 700; font-size: 13px; }
  .ok { color: var(--good); } .issues { color: var(--bad); } .other { color: var(--amber); }
  .reading { margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  h3 { margin: 0 0 6px; font-size: 12.5px; color: var(--dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  pre { margin: 0; font: 13px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; white-space: pre; overflow-x: auto; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .issue { color: var(--bad); }
  .y-key { color: var(--ink-arrow); } .y-str { color: var(--rep); } .y-lit { color: var(--amber); } .y-dash { color: var(--dim); }
  .scroll { overflow-x: auto; }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button.fold { font-size: 12px; padding: 1px 8px; margin: 2px 0 4px; }
  .hidden-note { font-size: 12px; margin: 2px 0 4px; }
  .hidden-note button { font-size: 12px; padding: 0 6px; }
  button.foldhead { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; margin: 0 0 6px;
    padding: 4px 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); border-color: var(--ink-arrow); }
  button.foldhead .hint { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--dim); }
  svg rect.hot:hover, svg rect.hot:focus-visible { stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 3; fill: var(--amber); fill-opacity: .08; outline: none; }
  button, select { background: var(--panel); color: var(--fg); border: 1px solid var(--edge); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--amber); }
  .pos { color: var(--dim); font: 13px ui-monospace, Menlo, monospace; }
  .stage { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 10px; height: 560px; }
  :root[data-mode="fullscreen"] .stage { height: calc(100vh - 230px); min-height: 560px; }
  .sessbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .sessbar button { font: 13px ui-monospace, Menlo, monospace; padding: 2px 8px; }
  .sessbar button.on { border-color: var(--amber); border-width: 2px; color: var(--amber); font-weight: 600; }
  .evrow > span { flex: none; }
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .sizebar { display: flex; align-items: center; gap: 6px; }
  .sizebar button { font-weight: 700; min-width: 2.6em; }
  .fsbtn { border-color: var(--ink-arrow); }
  .fsbtn[hidden] { display: none; }
  .seq { overflow: auto; height: 100%; min-width: 0; background: var(--stage); border-radius: 8px; }
  .seq .spacer { position: relative; }
  .seq, .evlog, .json { scrollbar-color: var(--life) var(--stage); }
  .seq::-webkit-scrollbar, .evlog::-webkit-scrollbar, .json::-webkit-scrollbar { width: 12px; height: 12px; }
  .seq::-webkit-scrollbar-thumb, .evlog::-webkit-scrollbar-thumb, .json::-webkit-scrollbar-thumb { background: var(--life); border-radius: 6px; border: 3px solid var(--stage); }
  .seq::-webkit-scrollbar-track, .evlog::-webkit-scrollbar-track, .json::-webkit-scrollbar-track, .seq::-webkit-scrollbar-corner { background: var(--stage); }
  .seq canvas { position: sticky; top: 0; left: 0; border-radius: 0; background: var(--stage); }
  .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; height: 100%; }
  .cap { margin: 0; font-size: 12px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
  .evlog { position: relative; flex: 1 1 55%; min-height: 0; overflow: auto; background: var(--stage); border-radius: 8px; padding: 6px 0;
    font: 13px/1.8 ui-monospace, "DejaVu Sans Mono", Menlo, monospace; }
  .evrow { display: flex; gap: .9em; padding: 0 10px; white-space: nowrap; cursor: pointer; color: var(--req); }
  .evrow .eid, .evrow .ses { color: var(--dim); }
  .evrow .pri, .evrow .rt { color: var(--dim); }
  .evrow.rep { color: var(--rep); } .evrow.bad { color: var(--bad); } .evrow.act { color: var(--amber); }
  .evrow.future { opacity: .25; }
  .evrow.on { background: rgba(251, 191, 36, .16); box-shadow: inset 3px 0 0 var(--amber); }
  .evrow.on .eid { color: var(--amber); }
  .evrow.mine .eid::before { content: "● "; color: var(--amber); }
  .evrow:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .json { margin: 0; flex: 1 1 45%; min-height: 0; overflow: auto; background: var(--stage); border-radius: 8px;
    padding: 8px 12px; font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", Menlo, monospace; white-space: pre; color: var(--fg); }
  .json .k { color: var(--cyan); } .json .s { color: var(--rep); } .json .n { color: var(--amber); }
  .json .l { color: var(--bad); } .json .p { color: var(--dim); }
  canvas { display: block; width: 100%; height: 420px; background: var(--panel); border-radius: 8px; }
  .detail { font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); white-space: pre-wrap; }
  .meta, .more { color: var(--dim); font-size: 13px; }
  .err { color: var(--bad); }
  textarea { width: 100%; min-height: 320px; resize: vertical; background: var(--bg); color: var(--fg);
    border: 1px solid var(--edge); border-radius: 6px; padding: 8px 10px;
    font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; tab-size: 2; }
  textarea:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .snips { display: flex; flex-wrap: wrap; gap: 6px; }
  .snips button { font: 13px ui-monospace, Menlo, monospace; padding: 2px 8px; }
  .edit-status { font-size: 13px; color: var(--dim); min-height: 1.4em; }
  .edit-status.bad { color: var(--bad); } .edit-status.good { color: var(--good); }
  .walk-steps { margin: 0 0 8px; padding-left: 26px; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  .walk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
  .walk-role { min-width: 9em; font-weight: 600; }
  button.step { font-size: 15px; padding: 6px 14px; border-color: var(--ink-arrow); }
  button.step.choice { border-color: var(--amber); border-width: 2px; }
  .walk-wait { color: var(--dim); font-size: 14px; }
  .walk-end { color: var(--good); font-weight: 600; }
  .sketch svg { display: block; width: 100%; height: 150px; background: var(--bg); border-radius: 6px; }
  .sketch .lane { cursor: pointer; }
  .sketch-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .sketch-form input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 8px; font: 15px ui-monospace, Menlo, monospace; min-width: 9em; }
  .sketch-hint { font-size: 14px; color: var(--dim); margin: 6px 0 0; }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .nav .tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--edge); margin-bottom: 8px; }
  .nav .tab { border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: transparent; color: var(--dim);
    padding: 5px 14px; margin-bottom: -1px; }
  .nav .tab.lit { color: var(--fg); }
  .nav .tab.on { background: var(--panel); color: var(--amber); border-color: var(--edge); border-width: 1px; border-bottom: 0; font-weight: 600; }
  .nav .group { min-width: 6.5em; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .propform { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .propform textarea { min-height: 3.5em; font: 13px ui-monospace, Menlo, monospace; }
  .nav button.on { border-color: var(--amber); border-width: 2px; font-weight: 600; }
  .nav input[type=number] { width: 7em; background: var(--bg); color: var(--fg); border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 6px; font: inherit; }
  table.rows { border-collapse: collapse; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  table.rows th, table.rows td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--edge); }
  table.rows th { color: var(--dim); font-weight: 600; }
  .chart svg { display: block; width: 100%; height: auto; }
  .code-tools { display: flex; gap: 8px; margin-bottom: 6px; }
  canvas.machine { height: 480px; cursor: grab; }
  .ftree { max-height: 70vh; overflow: auto; background: var(--panel); border-radius: 8px; padding: 4px 0;
    font: 16px/1.6 system-ui, sans-serif; outline: none; }
  .frow { display: flex; align-items: center; gap: 6px; padding: 1px 10px; white-space: nowrap; cursor: default; }
  .frow:hover { background: var(--edge); }
  .frow.sel { background: var(--edge); box-shadow: inset 3px 0 0 var(--amber); }
  .ftree:focus .frow.sel { box-shadow: inset 3px 0 0 var(--cyan); }
  .frow.lit { background: var(--amber); }
  .frow.lit .fname, .frow.lit .fkind { color: var(--bg) !important; }
  .twisty { display: inline-block; width: 1.2em; text-align: center; color: var(--dim); cursor: pointer; }
  .fmark { width: 1.4em; text-align: center; }
  .fkind { color: var(--dim); font-size: 13px; margin-left: 4px; }
  .moves { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .moves button { font: 14px ui-monospace, Menlo, monospace; }
  .src { counter-reset: none; }
  .src .ln { color: var(--dim); user-select: none; display: inline-block; min-width: 3.5em; }
  details > summary { cursor: pointer; color: var(--dim); }
  /* the navigator: the distillation chain chat, book, requirements, code; dark in either theme */
  .stagenav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; border-radius: 8px;
    background: #0b0f14; color: #eceae6; border: 1px solid #263445; }
  .stagenav { flex-direction: column; align-items: stretch; }
  .stagenav .chain, .stagenav .picks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .stagenav .chain button { font-size: 16px; padding: 4px 16px; }
  .stagenav button, .stagenav select { background: #16202b; color: #eceae6; border: 1px solid #263445; }
  /* the open list of a select is drawn by the browser: without these it keeps the system's light
     background and highlight under the select's light text, which cannot be read */
  option { background: var(--panel); color: var(--fg); }
  option:checked { background: var(--edge); color: var(--fg); }
  .stagenav select { color-scheme: dark; }
  .stagenav option { background: #16202b; color: #eceae6; }
  .stagenav option:checked { background: #263445; color: #fbbf24; }
  .stagenav button.on { border-color: #fbbf24; border-width: 2px; color: #fbbf24; font-weight: 600; }
  .stagenav .arrow { color: #9aa6b2; padding: 0 2px; }
  /* the stages and, nested under spec, explorer or index: tabs like the views bar's */
  .stagenav .tabs { gap: 2px; border-bottom: 1px solid #263445; }
  .stagenav .tabs button.tab { background: transparent; color: #9aa6b2; border: 1px solid transparent; border-bottom: 0;
    border-radius: 6px 6px 0 0; margin-bottom: -1px; font-weight: 400; }
  .stagenav .tabs button.tab:hover { color: #eceae6; }
  .stagenav .tabs button.tab.on { background: #16202b; color: #fbbf24; border-color: #263445; border-width: 1px; border-bottom: 0; font-weight: 600; }
  .stagenav .specrow { margin-left: 18px; }
  .stagenav .specrow button.tab { font-size: 14px; padding: 3px 12px; }
  .stagenav label { color: #9aa6b2; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .chatlog { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow: auto; }
  .chatmsg { border-left: 3px solid var(--edge); padding: 2px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chatmsg.user { border-left-color: var(--amber); }
  .chatmsg.assistant { border-left-color: var(--cyan); }
  .chatmsg .who { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; display: block; }
  .ctl-notation { font-size: 1.25em; font-weight: 600; white-space: pre-wrap; margin: 4px 0; }
  .bookpage { display: block; width: 100%; max-width: 1000px; height: auto; margin: 0 auto; border-radius: 4px; background: #fff; }
  .codegrid { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr); gap: 10px; }
  .codegrid pre.filetext { max-height: 70vh; overflow: auto; }
  /* text pages wrap to the window so nothing needs sideways scrolling at any zoom */
  pre.filetext { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
  .frow .links { color: var(--amber); font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<main id="app"><div id="editor"></div><div id="walk"></div><div id="results"><p class="meta">Waiting for a session tool result…</p></div></main>
<script>
"use strict";
// Draws session_check, session_diagram and session_simulate results. Tool data is placed only as
// text nodes, SVG geometry built with createElementNS, and canvas drawing. No network.
const MAX_SHAPES = 4000, MAX_EVENTS = 600, MAX_ITEMS = 64;
// The editor may call only these tools, one call at a time, with text that parses as JSON.
const EDIT_TOOLS = ["session_check", "session_simulate", "session_mdp", "session_actor", "session_dataset", "session_types", "session_explore", "session_review", "session_ctl", "session_sla", "session_instances", "session_skeleton", "session_openapi"], MAX_EDIT_BYTES = 65536, EDIT_PAUSE_MS = 700;
// A dataset is generated by LeanFM and only its summary comes back; at most MAX_DATASET sessions.
const MAX_DATASET = 10000, MAX_LABEL = 96;
// The tree lists at most MAX_TREE nodes and shows at most MAX_SOURCE lines of a node's source.
const MAX_TREE = 1500, MAX_SOURCE = 80;
// A state machine draws at most MAX_STATES states; above FOCUS_STATES only those within FOCUS_RADIUS
// transitions of the current state are drawn, so a machine too large to show stays explorable.
const MAX_STATES = 400, FOCUS_STATES = 60, FOCUS_RADIUS = 2;
const app = document.getElementById("app");
const editorBox = document.getElementById("editor"), results = document.getElementById("results");
const walkBox = document.getElementById("walk");
// The walk-through calls only session_next, one call at a time, with at most MAX_WALK events.
const WALK_TOOL = "session_next", MAX_WALK = 200;

// ---- JSON-RPC over postMessage --------------------------------------------------------------
let currentOverlay = null;
let nextId = 1;
const pending = new Map();
function send(msg) { window.parent.postMessage(msg, "*"); }
function rpc(method, params, timeoutMs) {
  const id = nextId++;
  send({ jsonrpc: "2.0", id, method, params });
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error("timeout")); } }, timeoutMs);
  });
}
function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  let msg = event.data;
  if (typeof msg === "string") { try { msg = JSON.parse(msg); } catch (_) { return; } }
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.method === undefined && msg.id !== undefined) {
    const p = pending.get(msg.id);
    if (p) { pending.delete(msg.id); msg.error ? p.reject(msg.error) : p.resolve(msg.result); }
    return;
  }
  const params = msg.params || {};
  switch (msg.method) {
    case "ui/notifications/tool-input": break;
    case "ui/notifications/tool-result": show(params); break;
    case "ui/notifications/host-context-changed": theme(params); break;
    case "ui/notifications/tool-cancelled": status("The tool call was cancelled."); break;
    default:
      if (msg.id !== undefined) send({ jsonrpc: "2.0", id: msg.id, result: {} });
  }
});

// ---- text size: A- and A+ scale everything the view shows (text, diagrams, canvases) with CSS zoom
// on the view's parts, not on the host; the bar itself stays at full size. Canvases work in their own
// unzoomed units and draw at pxRatio() so they stay sharp; pointer positions are divided by uiScale.
// The size is kept in the view's local storage when the host allows it.
const UI_SCALES = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.25, 1.5];
let uiScale = 1;
function pxRatio() { return (window.devicePixelRatio || 1) * uiScale; }
function applyScale(s) {
  uiScale = UI_SCALES.includes(s) ? s : 1;
  for (const part of [editorBox, walkBox, results]) part.style.zoom = String(uiScale);
  if (sizeLabel) sizeLabel.textContent = Math.round(uiScale * 100) + "%";
  try { window.localStorage.setItem("leanfm-ui-scale", String(uiScale)); } catch (_) {}
  setTimeout(reportSize, 0);
}
let sizeLabel = null;
function sizeBar() {
  const box = el("div", "sizebar"), down = el("button", "", "A-"), up = el("button", "", "A+");
  sizeLabel = el("span", "pos", "100%");
  down.setAttribute("aria-label", "Smaller text and drawings"); up.setAttribute("aria-label", "Larger text and drawings");
  const stepBy = (d) => { const i = UI_SCALES.indexOf(uiScale); applyScale(UI_SCALES[Math.max(0, Math.min(UI_SCALES.length - 1, (i < 0 ? 5 : i) + d))]); };
  down.addEventListener("click", () => stepBy(-1)); up.addEventListener("click", () => stepBy(1));
  box.append(down, sizeLabel, up);
  return box;
}

// ---- full screen: the host may offer to show the view in its side panel or full screen --------
// A button asks for it (the host grants it only right after a click in the view) and asks again to
// come back; the button shows only when the host offers full screen. The mode shown is the one the
// host reports, never the one asked for.
let displayMode = "inline";
const fsBtn = el("button", "fsbtn", "Full screen");
fsBtn.hidden = true;
fsBtn.setAttribute("aria-label", "Show the view full screen");
const topbar = el("div", "topbar");
topbar.append(sizeBar(), fsBtn);
app.insertBefore ? app.insertBefore(topbar, app.firstChild) : app.appendChild(topbar);
try { const saved = Number(window.localStorage.getItem("leanfm-ui-scale")); if (UI_SCALES.includes(saved)) applyScale(saved); } catch (_) {}
function setMode(m) {
  if (m !== "inline" && m !== "fullscreen") return;
  displayMode = m;
  document.documentElement.dataset.mode = m;
  fsBtn.textContent = m === "fullscreen" ? "Back to the conversation" : "Full screen";
  fsBtn.setAttribute("aria-label", m === "fullscreen" ? "Return the view to the conversation" : "Show the view full screen");
  reportSize();
}
fsBtn.addEventListener("click", async () => {
  const want = displayMode === "fullscreen" ? "inline" : "fullscreen";
  try { const r = await rpc("ui/request-display-mode", { mode: want }, 5000); setMode(r && r.mode); }
  catch (_) { fsBtn.title = "The host did not change the view's size."; }
});
function theme(ctx) {
  // the button switches between two modes, so it shows only when the host offers both
  if (ctx && Array.isArray(ctx.availableDisplayModes))
    fsBtn.hidden = !(ctx.availableDisplayModes.includes("fullscreen") && ctx.availableDisplayModes.includes("inline"));
  if (ctx && typeof ctx.displayMode === "string") setMode(ctx.displayMode);
  if (ctx && (ctx.theme === "light" || ctx.theme === "dark")) {
    document.documentElement.dataset.theme = ctx.theme;
    if (anim) anim.recolor();
  }
}

async function connect() {
  let delay = 400; const started = Date.now();
  while (Date.now() - started < 30000) {
    try {
      const result = await rpc("ui/initialize", {
        appInfo: { name: "leanfm-session-view", version: "1.0.0" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        protocolVersion: "2026-01-26" }, delay);
      theme(result && result.hostContext);
      notify("ui/notifications/initialized", {});
      return;
    } catch (_) { delay = Math.min(delay * 2, 5000); }
  }
  status("Could not connect to the host.", true);
}

let lastHeight = 0;
function reportSize() {
  const height = Math.ceil(app.getBoundingClientRect().bottom);
  if (height !== lastHeight) {
    lastHeight = height;
    notify("ui/notifications/size-changed", { width: Math.ceil(document.documentElement.scrollWidth), height });
  }
}
if (typeof ResizeObserver === "function") new ResizeObserver(reportSize).observe(document.body);

// ---- DOM helpers: text only ----------------------------------------------------------------
function el(tag, cls, text) {
  const node = document.createElement(tag);

// one generated session, stepped event by event with every actor's lifeline; the role's own

// ---- a dataset, as bar charts of counts LeanFM computed -------------------------------------

  const svg = sv("svg", { viewBox: `0 0 ${W} ${Math.max(1, rows.length) * rowH + 4}`, role: "img", "aria-label": label });
  rows.slice(0, MAX_ITEMS).forEach((r, i) => {

    const t = sv("text", { x: 0, y: y + 15, fill: "var(--fg)", "font-size": 14 }, full.length > MAX_LABEL ? full.slice(0, MAX_LABEL - 3) + "..." : full);
    t.appendChild(sv("title", {}, full));

    svg.appendChild(sv("rect", { x: 0, y: y + 21, width: w, height: 13, rx: 3, fill: "var(--ink-arrow)" }));
    const pct = total ? " (" + (100 * v / total).toFixed(1) + "%)" : "";

// ---- the tree: session_explore's nodes as an indented list, like a file explorer ---------------

  sessions: "cyan", message: "ink-arrow", event: "ink-arrow" };

  const pre = el("pre", "src");

// a tool call whose answer goes into one panel, not the whole page

    else if (body && typeof body === "object") { target.replaceChildren(el("p", "reading", String(body.reading || "")), render1(body)); }

}

  const controls = el("div", "controls");

  controls.append(openB, closeB);

      const mark = el("span", "fmark", t.kids.length ? (t.open ? "📂" : "📁") : "📄");

// ---- a CTL verdict: the formula read back, and the path that proves or breaks it ----------------

    out.push(panel("Properties suggested for this protocol", box));

// questions about one message, asked of session_ctl from the tree
function messageQuestions(label) {

    ["Does " + label + " always happen?", { AF: a }],
    ["After " + label + ", can the session still end?", { AG: { implies: [a, { EF: "terminal" }] } }] ];

// ---- a message's payload: what LeanFM says it carries ------------------------------------------
function payloadView(r) {

  if (r.example && typeof r.example === "object") {
    box.appendChild(panel("Example JSON (as posted or returned)", codeBox(JSON.stringify(r.example, null, 2))));
    if (r.exampleNote) box.appendChild(el("p", "meta", String(r.exampleNote)));
  }
  if (typeof r.proto === "string") box.appendChild(panel("Protobuf" + (r.field != null ? ` (payload field ${r.field} of the envelope)` : ""), codeBox(r.proto)));

      box.appendChild(row);
    }
  } else if (sec === "transitions") {
    const ul = el("ul");
    for (const x of items) ul.appendChild(el("li", "", `${x.src} → ${x.dst}: ${x.message}` + (x.source_actor ? `  (${x.source_actor} → ${x.destination_actor})` : "")));
    box.appendChild(ul);
  } else if (sec === "properties") {
    for (const pr of items) { box.appendChild(el("strong", "", String(pr.name || ""))); box.appendChild(el("pre", "", String(pr.formula || pr.expression || ""))); box.appendChild(el("p", "meta", String(pr.mode || "") + " · " + String(pr.origin || "") + (pr.cut ? " · cut" : ""))); }
  } else if (sec === "constraints") {
    for (const c of items) { box.appendChild(el("strong", "", "where_ " + String(c.id || ""))); box.appendChild(el("pre", "", String(c.formula || c.predicate || ""))); }
  } else if (sec === "clauses") {
    for (const c of items) {
      const d = el("details"), sm = el("summary", "", `${c.id} [${c.status}] · ${c.area}`);
      d.append(sm, el("p", "detail", String(c.requirement || "") + (c.cut ? " (cut)" : "")));
      box.appendChild(d);
    }
  } else if (sec === "protocols") {
    const plist = el("div", "ftree");
    for (const f of items) {
      const row = el("div", "frow"); row.tabIndex = 0;
      row.append(el("span", "fmark", "§"), el("span", "fname", String(f)), el("span", "fkind", "open: tree, diagram, animation"));
      const go = () => openProtocol(String(f));
      row.addEventListener("click", go);
      row.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
      plist.appendChild(row);
    }
    box.appendChild(plist);
  }
  const pager = el("div", "controls");
  pager.appendChild(el("span", "pos", items.length ? `${off + 1} to ${off + items.length} of ${total}` : `0 of ${total}`));
  const again = (o) => openStage("requirements", Object.assign({ section: sec, offset: o }, typeof body.task === "string" ? { task: body.task } : {}));
  if (off > 0) { const b = el("button", "", "First page"); b.addEventListener("click", () => again(0)); pager.appendChild(b); }
  if (Number.isInteger(pg.next)) { const b = el("button", "", "Next page ▶"); b.addEventListener("click", () => again(pg.next)); pager.appendChild(b); }
  parts.push(panel(what.charAt(0).toUpperCase() + what.slice(1), box), pager);
  return parts;
}
async function openProtocol(file) {
  // the server reads the one file itself: the view never carries a project's text to load it
  status("Loading " + file + "…");
  if (inFlight) await new Promise((r) => setTimeout(r, 150));
  inFlight = true;
  try {
    const result = await rpc("tools/call", { name: "session_explore", arguments: { project: nav.project, file } }, 30000);
    const sbody = result && result.structuredContent;
    if (result && result.isError) status(file + ": " + String((sbody && sbody.reason) || "LeanFM refused the protocol."), true);
    else { nav.stage = "requirements"; nav.specView = file === nav.primary ? "explore" : "index"; drawStageBar(); show(result); say(file + " is open: Whole protocol draws its interaction diagram, Animate plays its event stream.", "good"); }
  } catch (e) { status("session_explore failed: " + String((e && e.message) || e), true); }
  finally { inFlight = false; }
}
// the source tree comes a page of files at a time: the view asks for each next page in turn (at most
// MAX_ROWS files) and keeps the listing; a picked file's text comes a page at a time too
function codeStage(body) {
  const impl = typeof body.implementation === "string" ? body.implementation : null;
  const parts = [stageHead(body, impl ? "code · " + impl : "code")];
  if (impl && body.check && typeof body.check === "object") {
    const ck = body.check, ok = ck.status === "validated";
    const line = el("p", "meta", impl + (impl === body.defaultImplementation ? " (default)" : "") + ": " + String(ck.status) +
      (typeof ck.target === "string" ? ", target " + ck.target : "") + (num(ck.errors) ? ", " + num(ck.errors) + " unbound actors or messages" : "") +
      " against the one specification (" + String(ck.file || "") + ")");
    line.appendChild(el("span", "badge " + (ok ? "ok" : "issues"), ok ? "validated" : String(ck.status)));
    parts.push(line);
  }
  const project = String(body.project || nav.project) + (impl ? "#" + impl : "");
  if (body.page && typeof body.page === "object") {
    const pg = body.page, got = (Array.isArray(pg.items) ? pg.items : []).filter((f) => f && typeof f.path === "string");
    if (num(pg.offset) > 0 && nav.code && nav.code.project === project) nav.code.files = nav.code.files.concat(got).slice(0, MAX_ROWS);
    else nav.code = { project, files: got.slice(0, MAX_ROWS), mappings: Array.isArray(body.mappings) ? body.mappings.slice(0, MAX_ROWS) : [], root: body.root, from: body.file, selected: null };
    nav.code.next = Number.isInteger(pg.next) ? pg.next : null;
    nav.code.total = num(pg.total); nav.code.cut = !!body.filesCut;
    if (nav.code.next !== null && nav.code.files.length < MAX_ROWS) {
      const at = nav.code.next;
      const more = { project: String(body.project || nav.project), stage: "code", offset: at };
      if (impl) more.impl = impl;
      setTimeout(() => navCall(more, true).then((b) => { if (b && b.stage === "code" && nav.stage === "code") stageView(b); }), 0);
    }
  }
  if (body.selected && typeof body.selected === "object") {
    if (!nav.code || nav.code.project !== project) nav.code = { project, files: [], mappings: [], root: body.root, from: body.file, next: null, total: 0 };
    nav.code.selected = body.selected;
  }
  const code = nav.code && nav.code.project === project ? nav.code : { files: [], mappings: [], next: null, total: 0, selected: null };
  const files = code.files;
  // the tree: directories fold, files show how many traceability mappings name them
  const tree = { dirs: new Map(), files: [] };
  for (const f of files) {
    const path = String(f.path || ""), segs = path.split("/");
    let node = tree;
    for (const d of segs.slice(0, -1)) { if (!node.dirs.has(d)) node.dirs.set(d, { dirs: new Map(), files: [] }); node = node.dirs.get(d); }
    node.files.push({ name: segs[segs.length - 1], path, links: Array.isArray(f.links) ? f.links : [] });
  }
  const list = el("div", "ftree");
  const sel = code.selected;
  const selPath = sel && typeof sel.path === "string" ? sel.path : "";
  // the picked file's folders are open
  selPath.split("/").slice(0, -1).reduce((acc, d) => { const k = acc + d + "/"; nav.codeOpen.add(k); return k; }, "");
  const draw = () => {
    list.replaceChildren();
    const walk = (node, prefix, depth) => {
      for (const [d, kid] of [...node.dirs.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
        const key = prefix + d + "/", open = nav.codeOpen.has(key);
        const row = el("div", "frow"); row.style.paddingLeft = (10 + depth * 16) + "px"; row.tabIndex = 0;
        row.setAttribute("aria-expanded", String(open));
        row.append(el("span", "twisty", open ? "▾" : "▸"), el("span", "fname", d + "/"));
        row.addEventListener("click", () => { if (open) nav.codeOpen.delete(key); else nav.codeOpen.add(key); draw(); reportSize(); });
        list.appendChild(row);
        if (open) walk(kid, key, depth + 1);
      }
      for (const f of node.files) {
        const row = el("div", "frow" + (f.path === selPath ? " sel" : "")); row.style.paddingLeft = (28 + depth * 16) + "px"; row.tabIndex = 0;
        row.append(el("span", "fname", f.name));
        if (f.links.length) row.appendChild(el("span", "links", "↔ " + f.links.length));
        const go = () => openStage("code", { file: f.path });
        row.addEventListener("click", go);
        row.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
        list.appendChild(row);
      }
    };
    walk(tree, "", 0);
  };
  draw();
  const side = el("div");
  if (sel && typeof sel.text === "string") {
    const maps = Array.isArray(sel.mappings) ? sel.mappings : [];
    const mbox = el("div");
    for (const m of maps.slice(0, MAX_ITEMS)) {
      if (!m || typeof m !== "object") continue;
      const d = el("details"); d.open = maps.length <= 3;
      d.appendChild(el("summary", "", String(m.name || "mapping") + " · " + (Array.isArray(m.requirements) ? m.requirements.slice(0, 4).join(", ") : "")));
      const add = (label, xs) => { if (Array.isArray(xs) && xs.length) { d.appendChild(el("h3", "", label)); const ul = el("ul"); xs.slice(0, MAX_ITEMS).forEach((x) => ul.appendChild(el("li", "", String(x)))); d.appendChild(ul); } };
      add("Requirements", m.requirements); add("Files", m.files); add("Symbols", m.symbols); add("Tests", m.tests);
      mbox.appendChild(d);
    }
    side.appendChild(panel("Traceability for " + selPath + " (" + maps.length + ")", maps.length ? mbox : el("p", "meta", "No mapping names this file.")));
    const off = num(sel.offset), total = num(sel.total), text = String(sel.text);
    const pre = el("pre", "filetext", text);
    const pager = el("div", "controls");
    pager.appendChild(el("span", "pos", `characters ${off + 1} to ${off + text.length} of ${total}` + (sel.cut ? " (the first 256 KiB)" : "")));
    if (off > 0) { const b = el("button", "", "First page"); b.addEventListener("click", () => openStage("code", { file: selPath })); pager.appendChild(b); }
    if (Number.isInteger(sel.next)) { const b = el("button", "", "Next page ▶"); b.addEventListener("click", () => openStage("code", { file: selPath, offset: sel.next })); pager.appendChild(b); }
    const fileBox = el("div"); fileBox.append(pager, pre);
    side.appendChild(panel(selPath, fileBox));
  } else side.appendChild(el("p", "meta", `${files.length}${code.next !== null ? " of " + code.total + " (loading)" : code.cut ? "+" : ""} files, ${code.mappings.length} traceability mappings from ${code.from || body.file || "none"}. Pick a file to see its text and the requirements it implements.`));
  const grid = el("div", "codegrid"); grid.append(panel("Source" + (code.root ? " · " + code.root + "/" : ""), list), side);
  parts.push(grid);
  return parts;
}

connect().then(() => navCall({}, true)).then((body) => { if (body) stageView(body); });
