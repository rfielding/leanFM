syntax = "proto3";

package leanfm.generated;

// LLM-generated atomic message payloads for LeanFM.LLMGenerated.Requirements.
// RequirementEnvelope.oneof atom is the byte-level sum-type discriminator.
// The Lean requirement file defines src/dst traffic, framing, valid ordering,
// probabilities, dwell time, CTL-style properties, charts, and markdown.

message RequirementEnvelope {
  oneof atom {
    Docs_GetRequest docs_get_request = 1;
    Docs_FetchCommand docs_fetch_command = 2;
    Docs_FetchResult200 docs_fetch_result200 = 3;
    Docs_FetchResult404 docs_fetch_result404 = 4;
    Docs_GetResponse docs_get_response = 5;
    Error_Response error_response = 6;
    Reviews_PostRequest reviews_post_request = 7;
    Reviews_ModerateCommand reviews_moderate_command = 8;
    Reviews_ModerationAccepted reviews_moderation_accepted = 9;
    Reviews_ModerationRejected reviews_moderation_rejected = 10;
    Reviews_PostResponse201 reviews_post_response201 = 11;
    Reviews_PostResponse400 reviews_post_response400 = 12;
  }
}

message Docs_GetRequest {
  string method = 1;
  string path = 2;
  bytes auth_proof = 3;
  string return_to = 4;
}

message Docs_FetchCommand {
  string path = 1;
  string cache_mode = 2;
  string return_to = 3;
}

message Docs_FetchResult200 {
  uint32 status = 1;
  string path = 2;
  uint64 bytes_moved = 3;
  uint64 cpu_ms = 4;
}

message Docs_FetchResult404 {
  uint32 status = 1;
  string path = 2;
  uint64 cpu_ms = 3;
}

message Docs_GetResponse {
  uint32 status = 1;
  string path = 2;
  uint64 bytes_moved = 3;
}

message Error_Response {
  uint32 status = 1;
  string reason = 2;
}

message Reviews_PostRequest {
  string method = 1;
  string path = 2;
  bytes auth_proof = 3;
  string body_hash = 4;
  string return_to = 5;
}

message Reviews_ModerateCommand {
  string body_hash = 1;
  string policy = 2;
  string return_to = 3;
}

message Reviews_ModerationAccepted {
  string decision = 1;
  string body_hash = 2;
  uint64 cpu_ms = 3;
}

message Reviews_ModerationRejected {
  string decision = 1;
  string body_hash = 2;
  uint64 cpu_ms = 3;
}

message Reviews_PostResponse201 {
  uint32 status = 1;
  string path = 2;
  string review_id = 3;
}

message Reviews_PostResponse400 {
  uint32 status = 1;
  string path = 2;
  string reason = 3;
}
