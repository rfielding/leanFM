syntax = "proto3";
package leanfm.application_launch;
message ApplicationStartRequested { string project_id = 1; string request_id = 2; }
message ApplicationReady { string project_id = 1; string instance_id = 2; string revision = 3; string url = 4; string request_id = 5; }
message ApplicationLaunchRejected { string project_id = 1; string reason = 2; string request_id = 3; }
message ApplicationStatusRequested { string project_id = 1; string request_id = 2; }
message ApplicationStatusReturned { string project_id = 1; string instance_id = 2; string revision = 3; string state = 4; string url = 5; string reason = 6; string request_id = 7; }
message ApplicationStopRequested { string project_id = 1; string instance_id = 2; string request_id = 3; }
message ApplicationStopped { string project_id = 1; string instance_id = 2; string request_id = 3; }
message ApplicationStopRejected { string project_id = 1; string reason = 2; string request_id = 3; }
