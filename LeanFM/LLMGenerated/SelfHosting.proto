syntax = "proto3";
package leanfm.selfhost;
// Proposed workflow payloads; snapshot_id is the digest of the input manifest.
// Digest algorithm and executable mappings await implementation acceptance.
message RevisionProposed {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message RequirementsChecked {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message RequirementsAccepted {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message ImplementationProposed {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message ImplementationAccepted {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message GenerationRequested {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message GenerationDispatched {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message PatchReturned {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message VerificationReported {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message PRDelivered {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string artifact_digest = 4;
}
message WorkflowRejected {
  string project_id = 1;
  string snapshot_id = 2;
  string request_id = 3;
  string reason = 4;
}
// MCP logic consultation (selfhost.mcp.logic.*). input_json and evidence_json are JSON documents
// interpreted as data only; their grammar is the logic-reference resource.
message LogicConsultRequested {
  string tool = 1;
  string input_json = 2;
  string request_id = 3;
}
message LogicVerdict {
  string tool = 1;
  string verdict = 2;
  string reading = 3;
  string evidence_json = 4;
  string bounds = 5;
  string request_id = 6;
}
message LogicInputRejected {
  string tool = 1;
  string reason = 2;
  string request_id = 3;
}
